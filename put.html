<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта пути · «Подбор вуза»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141222;
  --fog:#413C63;
  --moss:#4E7A4A;
  --stone:#7C7A8C;
  --water:#2E6F8E;
  --gold:#E0A33E;
  --spark:#E8E3F2;
  --panel:#1C1830;
  --raise:#241E38;
  --dim:#9A96AE;
  --edge:#5C5678;
  --u:4px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--spark)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.px{font-family:"Pixelify Sans",Handjet,sans-serif}
.phone{max-width:390px;margin:0 auto;padding-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 4px}
.top p{margin:0;font-size:13px;color:var(--dim)}
.frame{
  border-radius:0;
  box-shadow:
    0 calc(var(--u) * -1) 0 var(--edge),
    0 var(--u) 0 var(--edge),
    calc(var(--u) * -1) 0 0 var(--edge),
    var(--u) 0 0 var(--edge),
    var(--u) var(--u) 0 rgba(0,0,0,.45);
}
.menu-btn{background:var(--raise);border:0;padding:4px 10px;font-size:13px;margin:4px}
.now{
  position:sticky;top:4px;z-index:5;margin:8px 8px 12px;
  background:var(--panel);padding:10px 12px;
}
.task{display:block;width:100%;text-align:left;background:transparent;border:0;padding:0}
.task b{display:block;font-size:16px;font-weight:650}
.days{margin:2px 0 0;font-size:14px;color:var(--dim)}
.goals{display:block;width:100%;text-align:left;background:var(--raise);border:0;padding:6px 8px;margin:8px 0 0;font-size:14px}
.goals em{font-style:normal;color:var(--dim)}
.goals b{font-weight:600}
.orbs{display:flex;justify-content:space-between;gap:4px;margin:2px 0 4px}
.orb{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:0;background:none;border:0;padding:0;line-height:1.2}
.orb .ring,.orb .core{
  display:grid;place-items:center;
  clip-path:polygon(30% 0,70% 0,70% 5%,85% 5%,85% 15%,95% 15%,95% 30%,100% 30%,100% 70%,95% 70%,95% 85%,85% 85%,85% 95%,70% 95%,70% 100%,30% 100%,30% 95%,15% 95%,15% 85%,5% 85%,5% 70%,0 70%,0 30%,5% 30%,5% 15%,15% 15%,15% 5%,30% 5%);
}
.orb .ring{width:48px;height:48px;background:conic-gradient(var(--gold) calc(var(--p) * 1%), var(--edge) 0)}
.orb .core{width:38px;height:38px;background:var(--panel);font-size:16px}
.orb.empty .ring{background:var(--edge)}
.orb.empty .core{color:var(--dim)}
.orb .name{font-size:13px;white-space:nowrap}
.orb .goal{font-size:13px;color:var(--dim);white-space:nowrap}
.me h2{font-size:16px}
.me h3{margin:10px 0 4px;font-size:13px}
.me .tiles{gap:4px;margin:0}
.me .tile{aspect-ratio:auto;height:32px;align-items:center;justify-content:center;text-align:center;padding:2px}
.orb .goal.gap{color:var(--gold)}
.stage{position:relative;width:384px;margin:0 auto}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.nodes{position:absolute;inset:0;pointer-events:none}
.node{
  position:absolute;pointer-events:auto;
  transform:translate(-50%,-50%);
  background:var(--ink);color:var(--spark);
  border:0;border-radius:0;padding:2px 6px;text-align:left;max-width:108px;
}
.node b{display:block;font-size:16px;font-weight:500;line-height:1.15;white-space:nowrap}
.node span{display:block;font-size:13px;color:var(--dim);line-height:1.25}
.node.on b{color:var(--gold)}
.node.off{opacity:.55}
.tag{
  position:absolute;left:8px;pointer-events:none;
  font-size:14px;color:var(--spark);text-shadow:2px 2px 0 var(--ink);
}
.flag{
  position:absolute;left:0;top:0;z-index:3;pointer-events:none;
  transition:transform 300ms cubic-bezier(0.25,1,0.5,1);
}
.pennant{display:block;width:12px;height:16px;background:var(--spark);clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
.me{margin:12px 8px 0;background:var(--panel);padding:10px 12px}
.me h2{margin:0 0 4px;font-size:20px;font-weight:500}
.me h3,.sheet h3{margin:14px 0 6px;font-size:16px;font-weight:500;color:var(--dim)}
.me p,.sheet p{margin:0 0 10px;font-size:14px;color:var(--dim)}
.me .lead,.sheet .lead{color:var(--spark);font-size:16px}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;
  opacity:0;pointer-events:none;
  transition:opacity 240ms cubic-bezier(0.22,1,0.36,1);
}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;z-index:11;
  width:min(390px,100%);max-height:82vh;overflow:auto;
  background:var(--panel);padding:16px;
  transform:translateX(-50%) scale(0.9);transform-origin:center bottom;
  opacity:0;pointer-events:none;
  transition:transform 240ms cubic-bezier(0.22,1,0.36,1),opacity 240ms cubic-bezier(0.22,1,0.36,1);
}
.sheet.on{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.sheet h2{margin:0 0 6px;font-size:20px;font-weight:500}
.btn,.opt,.slot,.field{
  display:block;width:100%;text-align:left;
  background:var(--raise);color:var(--spark);
  border:0;border-radius:0;padding:10px 12px;margin:0 0 10px;
}
.opt b,.slot b{display:block;font-size:16px;font-weight:650}
.opt span,.slot span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.opt.on,.slot.on{background:#2A2410}
.opt.on b{color:var(--gold)}
.slot:disabled,.btn:disabled,.opt:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled),.opt:active:not(:disabled),.slot:active:not(:disabled),.menu-btn:active{transform:translate(var(--u),var(--u));box-shadow:none}
.node:active{transform:translate(calc(-50% + var(--u)),calc(-50% + var(--u)));box-shadow:none}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.chip{background:var(--raise);border:0;padding:8px 10px;text-align:left;font-size:15px;color:var(--spark)}
.chip span{display:block;font-size:13px;color:var(--dim)}
.chip.on{background:#3A2E12;color:var(--gold)}
.chip:disabled{opacity:.5;cursor:default}
.chip:active:not(:disabled){transform:translate(var(--u),var(--u));box-shadow:none}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.skill{margin:0 0 10px;padding:8px 10px;background:var(--raise)}
.skill .head{display:flex;justify-content:space-between;gap:8px}
.skill b{font-size:15px}
.skill .num{font-size:16px;color:var(--spark)}
.skill .num.gap{color:var(--gold)}
.skill p{margin:2px 0 0;font-size:13px}
.bar{position:relative;height:8px;background:var(--ink);margin:6px 0 2px}
.bar i{
  display:block;height:100%;width:100%;background:var(--gold);
  transform:scaleX(0);transform-origin:left center;
  transition:transform 300ms cubic-bezier(0.22,1,0.36,1);
}
.bar s{position:absolute;top:-3px;width:2px;height:14px;background:var(--spark)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 10px}
.tile{
  aspect-ratio:1;border:0;padding:4px;background:var(--raise);color:var(--dim);
  font-size:12px;line-height:1.15;display:flex;align-items:flex-end;text-align:left;
}
.tile.on{background:#3A2E12;color:var(--gold)}
.tile.sel{outline:2px solid var(--spark);outline-offset:2px}
.node:focus-visible,.btn:focus-visible,.opt:focus-visible,.slot:focus-visible,.task:focus-visible,.menu-btn:focus-visible,.tile:focus-visible,.field:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px;
}
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled),.opt:hover:not(:disabled),.slot:hover:not(:disabled){background:#2C2648}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.overlay,.flag,.bar i{transition:none}
  .sheet,.sheet.on{transform:translateX(-50%)}
}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <p>Пример, не данные</p>
    <button class="menu-btn frame" id="menu-btn" type="button">Для проверки</button>
  </div>
  <section class="now frame" aria-label="Что делать сейчас">
    <button class="task" id="task" type="button"><b id="task-text" aria-live="polite"></b></button>
    <p class="days" id="days"></p>
    <button class="goals" id="goals" type="button"></button>
  </section>
  <div class="stage" id="stage">
    <canvas id="land" width="384" height="544"></canvas>
    <div class="nodes" id="nodes"></div>
    <div class="flag" id="flag"><i class="pennant"></i></div>
  </div>
  <section class="me frame" id="me" aria-label="Кто я сейчас"></section>
</div>
<div class="overlay" id="overlay"></div>
<div class="sheet frame" id="sheet" role="dialog" aria-modal="true"></div>
<script>
var T = 16, COLS = 24, ROWS = 34;
var SUBJECTS = {
  rus: {name:"Русский", short:"рус", gender:"m", dat:"русскому"},
  math:{name:"Математика", short:"мат", gender:"f", dat:"математике"},
  inf: {name:"Информатика", short:"инф", gender:"f", dat:"информатике"},
  phys:{name:"Физика", short:"физ", gender:"f", dat:"физике"},
  chem:{name:"Химия", short:"хим", gender:"f", dat:"химии"},
  bio: {name:"Биология", short:"био", gender:"f", dat:"биологии"},
  soc: {name:"Обществознание", short:"общ", gender:"n", dat:"обществознанию"},
  hist:{name:"История", short:"ист", gender:"f", dat:"истории"},
  eng: {name:"Английский", short:"англ", gender:"m", dat:"английскому"},
  lit: {name:"Литература", short:"лит", gender:"f", dat:"литературе"},
  geo: {name:"География", short:"гео", gender:"f", dat:"географии"}
};
var PICK = ["math","inf","phys","chem","bio","soc","hist","eng","lit","geo"];
var DIRS = [
  {id:"it", title:"IT", c:3, r:2, fixed:["math"], fan:["phys","inf"],
    about:"Чаще русский, математика и физика или информатика.",
    reels:["День разработчика: ошибка в данных, половина строк не сходится.","Стенд не запускается. До конца смены ищут, какой датчик врёт."]},
  {id:"law", title:"Право", c:11, r:2, fixed:["soc"], fan:["hist","inf","eng","math"],
    about:"Обществознание обязательно. Третьим бывают история, информатика, английский или математика.",
    reels:["Разбор кейса: два документа говорят разное, надо выбрать норму.","Приём: человеку объясняют, какой бумаги не хватает."]},
  {id:"econ", title:"Экономика", c:19, r:2, fixed:["math"], fan:["inf","hist","soc","eng","geo"],
    about:"Математика обязательна. Третий предмет вуз выбирает из своего списка.",
    reels:["Разбор отчёта: цифры сходятся, а вывод заказчика нет.","Смена в магазине: считают, почему полка пустая к вечеру."]},
  {id:"med", title:"Медицина", c:6, r:5.5, fixed:["bio","chem"], fan:[],
    about:"Русский, биология и химия. Оба предмета фиксированы.",
    reels:["Практика: надо остаться в кабинете, когда пациенту плохо.","Лаборатория: подпись на пробирке важнее скорости."]},
  {id:"art", title:"Творческие", c:14.5, r:5.5, fixed:["lit"], fan:[], dvi:true,
    about:"Часто литература плюс испытание вуза: рисунок, собеседование или конкурс.",
    reels:["Редактура: текст сокращают вдвое, смысл должен остаться.","Просмотр: работу оценивают люди, не балл ЕГЭ."]}
];
var ARTIFACTS = [
  {id:"ege", title:"Заявление на ЕГЭ", short:"ЕГЭ", text:"Фиксирует предметы. Появляется, когда объявишь их на воротах."},
  {id:"olymp", title:"Диплом олимпиады", short:"Олимп.", text:"Заключительный этап может снять конкурс. Призёр региона этого не делает."},
  {id:"medal", title:"Аттестат с отличием", short:"Аттест.", text:"Даёт баллы по правилам вуза."},
  {id:"benefit", title:"Справка о льготе", short:"Льгота", text:"Другой конкурс, не баллы."},
  {id:"consent", title:"Согласие на зачисление", short:"Согл.", text:"Последний документ пути. Пропуск срока необратим."}
];
var WAYS = [
  {id:"subj", side:"Налево", col:4, short:"Предметы", title:"По предметам", text:"Цели — то, что открывают выбранные экзамены."},
  {id:"auto", side:"Прямо", col:11, short:"Пробники", title:"Автоматически", text:"Цели — то, что открывают твои сильные пробники."},
  {id:"test", side:"Направо", col:18, short:"Тест", title:"Тест", text:"Цели — направления, которые ты отметил в тесте."}
];

var state;
function fresh(){
  return {
    way:null,
    exam:{slots:["rus",null,null,null], goal:null},
    sealed:false,
    test:null,
    scores:{
      rus:{now:78, prev:82, when:"сентябрь"},
      math:{now:72, prev:76, when:"сентябрь"},
      soc:{now:74, prev:null, when:"сентябрь"}
    },
    have:{ege:false, olymp:false, medal:false, benefit:false, consent:false},
    starred:{}
  };
}
state = fresh();
var sheet = {kind:null, id:null, pick:null, marks:null};
var art = null;
var anim = {id:null, n:0};

function calm(){ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
function t(s){
  return String(s).replace(/ — /g,"\u00A0— ").replace(/(^|[\s(«])([АаВвИиКкОоСсУуЯя]) /g,"$1$2\u00A0");
}
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text!=null) n.textContent = text;
  return n;
}
function low(id){ var n = SUBJECTS[id].name; return n.charAt(0).toLowerCase()+n.slice(1); }
function needOne(id){
  var g = SUBJECTS[id].gender;
  return (g==="m"?"нужен ":g==="n"?"нужно ":"нужна ")+low(id);
}
function joinOr(ids){
  var names = ids.map(low);
  if(names.length<3) return names.join(" или ");
  return names.slice(0,-1).join(", ")+" или "+names[names.length-1];
}
function daysWord(n){
  var a = n%10, b = n%100;
  if(a===1 && b!==11) return "день";
  if(a>=2 && a<=4 && (b<10 || b>=20)) return "дня";
  return "дней";
}
function daysUntil(y,m,d){
  var a = new Date(); a.setHours(0,0,0,0);
  return Math.max(0, Math.round((new Date(y,m-1,d)-a)/86400000));
}
function dirBy(id){ return DIRS.filter(function(d){ return d.id===id; })[0]; }
function wayBy(id){ return WAYS.filter(function(w){ return w.id===id; })[0]; }
function examSet(){ return state.exam.slots.filter(Boolean); }
function compact(){
  var rest = state.exam.slots.slice(1).filter(Boolean);
  state.exam.slots = ["rus", rest[0]||null, rest[1]||null, rest[2]||null];
}
function measured(id){ return !!state.scores[id] && typeof state.scores[id].now==="number"; }
function gapOf(id){
  if(state.exam.goal==null || !measured(id)) return null;
  return state.exam.goal - state.scores[id].now;
}

function cover(dir, set){
  var miss = dir.fixed.filter(function(id){ return set.indexOf(id)<0; });
  var fanOk = !dir.fan.length || dir.fan.some(function(id){ return set.indexOf(id)>=0; });
  return {open: set.length>=3 && !miss.length && fanOk, miss:miss, fanOk:fanOk};
}
function holeText(dir, set){
  var c = cover(dir, set);
  if(c.open) return dir.dvi ? "открыто, ещё испытание вуза" : "открыто";
  if(!c.miss.length){
    if(dir.fan.length>3) return "нужен предмет на выбор";
    if(dir.fan.length===1) return needOne(dir.fan[0]);
    return "нужны "+joinOr(dir.fan);
  }
  if(c.miss.length===1 && c.fanOk) return needOne(c.miss[0]);
  var parts = c.miss.map(low);
  if(!c.fanOk) parts.push(dir.fan.length>3 ? "предмет на выбор" : joinOr(dir.fan));
  return "нужны "+parts.slice(0,-1).join(", ")+" и "+parts[parts.length-1];
}
function shortHole(dir, set){
  var c = cover(dir, set);
  if(c.open) return dir.dvi ? "открыто, +ДВИ" : "открыто";
  var parts = c.miss.map(function(id){ return SUBJECTS[id].short; });
  if(!c.fanOk) parts.push(dir.fan.length>3 ? "на выбор" : dir.fan.map(function(id){ return SUBJECTS[id].short; }).join("/"));
  return "нужно: "+parts.join(", ");
}
function setFor(dir){
  var slots = ["rus"].concat(dir.fixed);
  if(dir.fan.length){
    var strong = dir.fan.filter(measured).sort(function(a,b){ return state.scores[b].now-state.scores[a].now; });
    slots.push(strong[0] || dir.fan[0]);
  }
  while(slots.length<4) slots.push(null);
  return slots.slice(0,4);
}
function autoSet(){
  var top = PICK.filter(measured).sort(function(a,b){ return state.scores[b].now-state.scores[a].now; }).slice(0,2);
  return top.length<2 ? null : ["rus"].concat(top);
}
function goals(way){
  if(way==="subj") return DIRS.filter(function(d){ return cover(d, examSet()).open; }).map(function(d){ return d.id; });
  if(way==="auto"){
    var s = autoSet();
    return s ? DIRS.filter(function(d){ return cover(d,s).open; }).map(function(d){ return d.id; }) : [];
  }
  if(way==="test") return state.test || [];
  return [];
}
function wayNote(w){
  if(w.id==="subj"){
    var n = examSet().length;
    return n<3 ? "не выбраны" : examSet().slice(1).map(function(id){ return SUBJECTS[id].short; }).join(" ");
  }
  if(w.id==="auto"){
    var s = autoSet();
    return s ? s.slice(1).map(function(id){ return SUBJECTS[id].short; }).join(" ") : "мало пробников";
  }
  return state.test ? state.test.map(function(id){ return dirBy(id).title; }).join(", ") : "не пройден";
}
function chooseWay(id){
  if(state.way===id) return;
  state.way = id;
  play(id);
}

function nowTask(){
  var set = examSet(), g = goals(state.way);
  if(!state.way) return {at:"stone", open:["stone"], text:"выбери у камня, как искать цели"};
  if(state.way==="test" && !state.test) return {at:"stone", open:["test"], text:"пройди тест у камня"};
  if(set.length<3) return {at:"gate", open:["gate"], text:"выбери предметы на воротах"};
  if(state.exam.goal==null) return {at:"gate", open:["gate"], text:"выбери порог на воротах"};
  var bare = set.filter(function(id){ return !measured(id); });
  if(bare.length) return {at:"boss", open:["boss"], text:"сдай пробник по "+SUBJECTS[bare[0]].dat};
  var short = set.filter(function(id){ return gapOf(id)>0; });
  short.sort(function(a,b){ return gapOf(b)-gapOf(a); });
  if(short.length) return {at:"boss", open:["boss"], text:"добери "+gapOf(short[0])+" по "+SUBJECTS[short[0]].dat};
  if(!state.sealed) return {at:"gate", open:["gate"], text:"до 1 февраля объяви предметы"};
  var open = g.filter(function(id){ return cover(dirBy(id), set).open; });
  return {at:open[0]||"law", open:["dir", open[0]||"law"], text:"посмотри, что открыто"};
}

var canvas = document.getElementById("land");
var ctx = canvas.getContext("2d");
function fill(c,r,color){ ctx.fillStyle = color; ctx.fillRect(c*T, r*T, T, T); }
function line(c0,r0,c1,r1){
  var out = [], dc = c1-c0, dr = r1-r0, steps = Math.max(Math.abs(dc), Math.abs(dr)), i;
  if(!steps) return [[c0,r0]];
  for(i=0;i<=steps;i++) out.push([Math.round(c0+dc*i/steps), Math.round(r0+dr*i/steps)]);
  return out;
}
function dedupe(list){
  var out = [], seen = {};
  list.forEach(function(p){
    var k = p[0]+","+p[1];
    if(!seen[k]){ out.push(p); seen[k] = true; }
  });
  return out;
}
function laneTiles(w){
  var c = w.col;
  return dedupe(line(11,27,c,25).concat(line(c,25,c,19)).concat(line(c,19,11,17)));
}
function step(c,r,color){
  var x = c*T, y = r*T;
  ctx.fillStyle = color;
  ctx.fillRect(x+5, y, 6, T);
  ctx.fillRect(x, y+5, T, 6);
}
function draw(){
  ctx.imageSmoothingEnabled = false;
  var r, c, set = examSet(), g = goals(state.way);
  for(r=0;r<ROWS;r++){
    for(c=0;c<COLS;c++){
      fill(c,r, ((c+r)%2===0) ? "#4E7A4A" : "#467244");
      if(c===0 || c===23) fill(c,r, ((c+r)%2===0) ? "#2E6F8E" : "#275F7A");
    }
  }
  for(r=0;r<8;r++) for(c=1;c<23;c++) fill(c,r, ((c+r)%2===0) ? "#2A2540" : "#26213A");
  for(c=1;c<23;c++) fill(c,8, c===11 ? "#26213A" : ((c%2)?"#7C7A8C":"#6E6C7E"));
  for(r=14;r<=16;r++) for(c=1;c<23;c++){
    if(c>=10 && c<=12) continue;
    fill(c,r, ((c*3+r)%5===0) ? "#6E6C7E" : "#7C7A8C");
  }
  [[2,12],[20,11],[6,29],[18,30],[21,23],[2,32],[15,12]].forEach(function(p){
    fill(p[0],p[1],"#2F5A32");
    ctx.fillStyle = "#1E3E22";
    ctx.fillRect(p[0]*T+6, p[1]*T+10, 4, 6);
  });
  DIRS.forEach(function(d){
    var col = Math.round(d.c), row = Math.min(7, Math.ceil(d.r)+1);
    var lit = g.indexOf(d.id)>=0;
    fill(col,row, lit && cover(d,set).open ? "#E0A33E" : (lit ? "#E8E3F2" : "#3A3550"));
  });
  var reach = g.some(function(id){ return cover(dirBy(id),set).open; });
  line(11,13,11,9).forEach(function(p){ step(p[0],p[1], reach ? "#E0A33E" : "#7C7A8C"); });
  for(r=14;r<=16;r++) step(11,r, set.length>=3 ? "#E0A33E" : "#7C7A8C");
  WAYS.forEach(function(w){
    if(w.id===state.way) return;
    laneTiles(w).forEach(function(q){ step(q[0],q[1],"#7C7A8C"); });
  });
  var a = wayBy(state.way);
  if(a){
    var tiles = laneTiles(a);
    var n = anim.id===a.id ? anim.n : tiles.length;
    tiles.forEach(function(q,i){ if(i<n) step(q[0],q[1],"#E0A33E"); });
  }
  if(state.sealed){
    ctx.fillStyle = "#E0A33E";
    ctx.fillRect(10*T+4, 15*T+4, 8, 8);
    ctx.fillRect(12*T+4, 15*T+4, 8, 8);
  }
  var sx = 11*T, sy = 27*T;
  ctx.fillStyle = "#7C7A8C"; ctx.fillRect(sx+1, sy+2, 14, 14);
  ctx.fillStyle = "#5C5A6C"; ctx.fillRect(sx+4, sy+6, 8, 2); ctx.fillRect(sx+4, sy+10, 6, 2);
  var mx = 11*T, my = 31*T;
  ctx.fillStyle = "#E8E3F2"; ctx.fillRect(mx+4, my, 8, 6);
  ctx.fillStyle = "#E0A33E"; ctx.fillRect(mx+3, my+6, 10, 8);
  ctx.fillStyle = "#141222"; ctx.fillRect(mx+5, my+2, 2, 2); ctx.fillRect(mx+9, my+2, 2, 2);
}
function play(id){
  var w = wayBy(id);
  if(!w || calm()){ anim = {id:null, n:0}; return; }
  var total = laneTiles(w).length;
  var wait = Math.max(16, Math.floor(500/total));
  anim = {id:id, n:0};
  var timer = setInterval(function(){
    if(anim.id!==id){ clearInterval(timer); return; }
    anim.n++;
    draw();
    if(anim.n>=total){ clearInterval(timer); anim = {id:null, n:0}; }
  }, wait);
}

      if(f.value==="") return;
      var prev = measured(id) ? state.scores[id].now : null;
      state.scores[id] = {now:Math.max(0, Math.min(100, Math.round(Number(f.value)))), prev:prev, when:"октябрь"};
      render();
    }));
  });
}
function dirSheet(box, id){
  var d = dirBy(id), set = examSet(), lit = goals(state.way).indexOf(id)>=0;
  box.appendChild(el("h2","px", d.title));
  box.appendChild(el("p","lead", t((lit ? "Цель. " : "")+(set.length>=3 ? "Твои экзамены: "+holeText(d,set)+"." : "Экзамены пока не выбраны."))));
  box.appendChild(el("p",null, t(d.about)));
  d.reels.forEach(function(text){
    var o = el("div","opt frame");
    o.appendChild(el("b",null,"Фрагмент дня"));
    o.appendChild(el("span",null, t(text)));
    box.appendChild(o);
  });
  box.appendChild(button("btn", state.starred[id] ? "Интересно, отмечено" : "Отметить как интересное", function(){
    state.starred[id] = !state.starred[id];
    fillSheet();
  }));
  if(!state.sealed && !cover(d,set).open) box.appendChild(button("btn","Взять набор под «"+d.title+"»", function(){
    state.exam.slots = setFor(d); render();
  }));
}
function chestSheet(box){
  box.appendChild(el("h2","px","Допы"));
  box.appendChild(el("p","lead", t("Документы, которые уже есть в жизни. Карта их не выдаёт, только отмечает.")));
  ["olymp","medal","benefit"].forEach(function(id){
    var a = ARTIFACTS.filter(function(x){ return x.id===id; })[0];
    var o = el("button","opt frame"+(state.have[id]?" on":""));
    o.type = "button";
    o.appendChild(el("b",null, a.title+(state.have[id]?", есть":"")));
    o.appendChild(el("span",null, t(a.text)));
    o.addEventListener("click", function(){ state.have[id] = !state.have[id]; render(); });
    box.appendChild(o);
  });
}

var SCENES = [
  {title:"Чистый лист", text:"Способ не выбран, экзаменов нет.", set:function(s){}},
  {title:"По предметам, без порога", text:"Русский, математика, информатика. Порог не выбран.", set:function(s){
    s.way = "subj"; s.exam.slots = ["rus","math","inf",null];
  }},
  {title:"Тест про медицину, экзамены другие", text:"В тесте отмечены медицина и IT, на воротах математика и информатика.", set:function(s){
    s.way = "test"; s.test = ["it","med"]; s.exam = {slots:["rus","math","inf",null], goal:80};
  }},
  {title:"Автоматически", text:"Цели по сильным пробникам: обществознание и математика.", set:function(s){
    s.way = "auto";
  }},
  {title:"После 1 февраля", text:"Предметы объявлены, печать стоит.", set:function(s){
    s.way = "subj"; s.exam = {slots:["rus","math","inf",null], goal:80}; s.sealed = true; s.have.ege = true;
    s.scores.inf = {now:70, prev:null, when:"январь"};
  }},
  {title:"Порог достигнут", text:"Все пробники выше порога.", set:function(s){
    s.way = "subj"; s.exam = {slots:["rus","math","inf",null], goal:75}; s.sealed = true; s.have.ege = true;
    s.scores.math = {now:80, prev:72, when:"октябрь"};
    s.scores.inf = {now:82, prev:null, when:"октябрь"};
  }}
];
function loadScene(i){
  state = fresh();
  SCENES[i].set(state);
  anim = {id:null, n:0};
  art = null;
  closeSheet();
  render();
  window.scrollTo(0,0);
}
function menuSheet(box){
  box.appendChild(el("h2","px","Для проверки"));
  box.appendChild(el("p",null, t("Сценарии для нас и дизайнеров. В продукт это меню не идёт.")));
  SCENES.forEach(function(s,i){
    var o = el("button","opt frame");
    o.type = "button";
    o.appendChild(el("b",null, s.title));
    o.appendChild(el("span",null, t(s.text)));
    o.addEventListener("click", function(){ loadScene(i); });
    box.appendChild(o);
  });
  box.appendChild(button("btn","Сбросить", function(){ loadScene(0); }));
}

function render(){
  draw();
  placeNodes();
  fillNow();
  fillMe();
  if(sheet.kind) fillSheet();
}
document.getElementById("overlay").addEventListener("click", closeSheet);
document.addEventListener("keydown", function(ev){ if(ev.key==="Escape" && sheet.kind) closeSheet(); });
document.getElementById("task").addEventListener("click", function(){ openSheet(nowTask().open); });
document.getElementById("goals").addEventListener("click", function(){ openSheet(["stone"]); });
document.getElementById("menu-btn").addEventListener("click", function(){ openSheet(["menu"]); });
render();
window.addEventListener("load", function(){ placeFlag(nowTask().at); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ placeFlag(nowTask().at); });
</script>
</body>
</html>
