<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тудушник · 9–10 класс</title>
<meta name="description" content="Низкодетальный прототип тудушника школьника: экран «Сейчас» и состояния задачи.">
<style>
:root{
  --bg:#ffffff; --surface:#f7f7f8; --surface-2:#f0f0f2;
  --text:#16161a; --text-2:#55555f; --text-3:#8a8a95;
  --line:#e3e3e7; --accent:#6245c9;
  --ok:#1a7f4b; --warn:#9a6207; --bad:#b3261e;
  --ok-bg:#eaf6ef; --warn-bg:#fcf3e3; --bad-bg:#fbeceb; --info-bg:#eceaf8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131316; --surface:#1a1a1f; --surface-2:#202027;
    --text:#ececf0; --text-2:#a8a8b3; --text-3:#74747f;
    --line:#2b2b33; --accent:#a493f0;
    --ok:#5ec98b; --warn:#e0b05a; --bad:#ec8a84;
    --ok-bg:#14261c; --warn-bg:#2a2113; --bad-bg:#2b1715; --info-bg:#1d1a2e;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.banner{max-width:390px;margin:0 auto;padding:16px 16px 8px}
.banner p{margin:0 0 8px;font-size:13px;color:var(--text-3)}
.switches{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 10px;font-size:13px;color:var(--text-2)}
.seg button.on{background:var(--bg);color:var(--text);font-weight:650;box-shadow:0 0 0 1px var(--line)}
.phone{max-width:390px;margin:0 auto;min-height:100vh;padding-bottom:28px}
.top{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;font-weight:650}
.status{margin:6px 0 0;padding:0;border:0;background:transparent;color:var(--text-2);font-size:14px;text-align:left}
.status b{color:var(--text);font-weight:650}
.views{display:flex;gap:4px;margin:10px 16px 0;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.views button{flex:1;border:0;background:transparent;border-radius:999px;padding:6px 8px;font-size:14px;color:var(--text-2)}
.views button.on{background:var(--bg);color:var(--text);font-weight:650;box-shadow:0 0 0 1px var(--line)}
.list{padding:14px 16px 0}
.kicker{margin:14px 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.kicker:first-child{margin-top:0}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;margin:0 0 8px}
.card h2{font-size:17px;line-height:1.3;margin:0 0 6px;font-weight:650}
.card p{margin:0 0 6px;font-size:14px;color:var(--text-2)}
.card .lock{color:var(--text)}
.row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.mark{flex:0 0 1.4em;color:var(--text-3);font-size:16px;line-height:1.3}
.row b{display:block;font-size:15px;font-weight:650}
.row span{display:block;font-size:13px;color:var(--text-2);margin-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:8px 14px}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px}
.ghost:disabled,.primary:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-size:12px;color:var(--accent);margin-bottom:4px}
.stale{color:var(--warn)}
.neutral{color:var(--text)}
.gap{margin:8px 0 0}
.gap .line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.note{font-size:13px;color:var(--text-2);margin:8px 0 0}
.panel{padding:14px 16px 24px}
.panel h2{font-size:18px;margin:8px 0}
.back{border:0;background:transparent;color:var(--accent);padding:0;font-size:14px}
label{display:block;font-size:14px;margin:10px 0 4px}
input[type="text"],input[type="number"],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
textarea{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 10px;font-size:14px}
.chip.on{border-color:var(--accent);background:var(--info-bg)}
.item{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.item b{font-weight:650}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;margin:0 0 14px}
.tl li::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tl li.now::before{background:var(--accent);border-color:var(--accent)}
.tl b{display:block}
.tl span{font-size:13px;color:var(--text-2)}
.err{color:var(--text);font-size:14px;margin:8px 0}
</style>
</head>
<body>
<div class="banner">
  <p>Прототип тудушника. Числа на экране — пример, не данные.</p>
  <div class="switches">
    <div class="seg" id="gradeSeg" role="group" aria-label="Класс">
      <button type="button" data-grade="9" class="on">9 класс</button>
      <button type="button" data-grade="10">10 класс</button>
    </div>
    <div class="seg" id="whoSeg" role="group" aria-label="Кто смотрит">
      <button type="button" data-who="student" class="on">Школьник</button>
      <button type="button" data-who="parent">Родитель</button>
    </div>
  </div>
</div>
<div class="phone" id="phone"></div>
<script>
const DIRS = ["Медицина", "Право", "Экономика", "Журналистика", "Инженерное дело"];
const S = {
  grade: 9,
  who: "student",
  tab: "now",
  panel: null,
  err: "",
  g9: {
    exclusions: [],
    none: false,
    done: false,
    rejected: "",
    shared: false,
    subjects: []
  },
  g10: {
    prev: 67,
    target: 85,
    score: null,
    hours: null,
    objected: ""
  },
  own: []
};

const phone = document.getElementById("phone");

function student(){ return S.who === "student"; }

function ours(){
  if (S.grade === 9) return [
    ["Карта профилей", "Профиль, предметы ОГЭ и ЕГЭ, сколько направлений каждый профиль открывает и закрывает. Какой выбрать — не говорим."],
    ["Календарь муниципального этапа", "Сроки в его регионе. Предмет не назначаем."],
    ["Срок записи на ОГЭ", "Дата записи в его школе. Сверяем перечень с его связкой «предметы — направления»."]
  ];
  return [
    ["Разрыв по темам", "Считаем от его цели и последнего замера. Месяц без замера разрыв не улучшает."],
    ["Допущение прогноза", "Прогноз показываем только с названным допущением. Голый диапазон баллов не выдаём."]
  ];
}

function waitingCount(){
  let n = 0;
  if (S.grade === 9){
    const excludeOpen = !S.g9.done && !S.g9.rejected;
    if (excludeOpen) n += 1;
    else if (!S.g9.subjects.length) n += 1;
  } else {
    if (S.g10.score == null) n += 1;
    if (S.g10.hours == null) n += 1;
  }
  S.own.forEach(function(t){ if (!t.done && t.date) n += 1; });
  return n;
}

function gapMath(){
  const score = S.g10.score == null ? S.g10.prev : S.g10.score;
  return S.g10.target - score;
}

function render(){
  const oursN = ours().length;
  const waitN = waitingCount();
  phone.innerHTML =
    '<header class="top"><h1>Сегодня</h1>' +
    '<button type="button" class="status" data-act="ours">Я делаю: <b>' + oursN + '</b> · Ждёт тебя: <b>' + waitN + '</b></button></header>' +
    '<div class="views" role="tablist">' +
    tabBtn("now", "Сейчас") + tabBtn("until", "До срока") + tabBtn("done", "Сделано") +
    '</div><div class="list" id="list"></div>';
  document.getElementById("list").innerHTML = S.panel ? panel() : view();
  document.querySelectorAll("#gradeSeg button").forEach(function(b){
    b.classList.toggle("on", Number(b.dataset.grade) === S.grade);
  });
  document.querySelectorAll("#whoSeg button").forEach(function(b){
    b.classList.toggle("on", b.dataset.who === S.who);
  });
}

function tabBtn(id, label){
  return '<button type="button" role="tab" data-act="tab" data-tab="' + id + '"' +
    (S.tab === id ? ' class="on" aria-selected="true"' : ' aria-selected="false"') + '>' + label + '</button>';
}

function view(){
  if (S.tab === "until") return timeline();
  if (S.tab === "done") return doneView();
  return S.grade === 9 ? now9() : now10();
}

function now9(){
  let html = "";
  if (!S.g9.done && !S.g9.rejected){
    if (student()){
      html += '<p class="kicker">Сначала это</p>';
      html += card({
        title: "Назови, куда точно не пойдёшь",
        cost: "Весной профиль выберется без твоего отсева",
        lock: "Не вернуть: после выбора профиля предметы фиксируют перечень направлений на два года",
        acts: [
          ['Назвать', 'exclude', true],
          ['Не так', 'notso', false],
          ['Подробнее', 'detail-exclude', false]
        ]
      });
    } else {
      html += '<p class="kicker">Сначала это</p>';
      html += card({
        title: "Одна задача про выбор направлений",
        cost: "Содержание у школьника"
      });
    }
  }
  const subjectsFirst = S.g9.done || S.g9.rejected;
  if (subjectsFirst && !S.g9.subjects.length && student()){
    html += '<p class="kicker">Сначала это</p>';
    html += card({
      title: "Назови предметы ОГЭ и зачем они",
      cost: "К весне запись на ОГЭ пройдёт без связи с направлениями",
      lock: "Не вернуть: предметы фиксируют перечень направлений на два года",
      acts: [['Назвать предметы', 'subjects', true]]
    });
  }
  html += '<p class="kicker">Дальше</p>';
  if (!(subjectsFirst && !S.g9.subjects.length && student())){
    html += row("○", "Назови предметы ОГЭ и зачем они", S.g9.subjects.length ? "названы" : "весна · не вернуть", "subjects");
  }
  html += row("◔", "Запись на муниципальный этап", "ждём списков школы", "wait-muni");
  S.own.forEach(function(t, i){
    if (t.done) return;
    if (!student() && !t.forParent) return;
    html += row("○", t.title, "твоё" + (t.date ? " · " + t.date : ""), "own-" + i);
  });
  html += '<p class="kicker">Закрылось, но можно вернуться</p>';
  html += row("✕", "Школьный этап ВсОШ", "следующий через год. В этом сентябре попытки нет", "missed");
  if (S.g9.rejected){
    html += '<p class="note">Отклонено тобой: «' + esc(S.g9.rejected) + '». Задачу можно вернуть.</p>';
    if (student()) html += '<div class="actions"><button type="button" class="ghost" data-act="unreject">Вернуть задачу</button></div>';
  }
  if (student()) html += '<div class="actions"><button type="button" class="ghost" data-act="own">Своя задача</button></div>';
  if (!student() && S.g9.done){
    html += '<p class="note">В «Сделано» есть запись про выбор направлений. Содержание у школьника.</p>';
  }
  return html;
}

function now10(){
  const g = S.g10;
  const stale = g.score == null;
  const gap = gapMath();
  const worse = g.score != null && g.score < g.prev;
  let html = '<p class="kicker">Сначала это</p>';
  if (g.score == null){
    html += card({
      title: "Сдай замер и обнови разрыв",
      cost: "Математика · разрыв до твоей цели: " + gap + " " + plural(gap, "балл", "балла", "баллов"),
      lock: "Последний замер был 5 недель назад: разрыв устарел",
      lockClass: "stale",
      acts: student() ? [
        ['Приложить балл', 'score', true],
        ['Не так', 'notso-score', false],
        ['Подробнее', 'detail-score', false]
      ] : []
    });
    if (!student()) html += '<p class="note">Балл прикладывает школьник. Тебе виден разрыв.</p>';
  } else {
    html += card({
      title: "Замер по математике принят",
      cost: worse
        ? "Балл ниже прошлого: " + g.score + " вместо " + g.prev + ". Разрыв теперь " + gap + ". Это корректный результат."
        : "Новый балл " + g.score + ". Разрыв до цели: " + gap + ".",
      lock: "Пересчитано по темам. Балл записан как есть.",
      lockClass: "neutral",
      result: worse ? "worse" : "ok"
    });
  }
  if (g.objected){
    html += '<p class="note">Оспорено: «' + esc(g.objected) + '». Замер по-прежнему закрывается баллом, не согласием с прогнозом.</p>';
  }
  html += '<p class="kicker">Дальше</p>';
  html += row("○", "Запиши объём на неделю", g.hours == null ? "твой выбор · часы или задачи" : g.hours + " ч на этой неделе", "volume");
  html += row("◔", "Результат пробника по русскому", "ждём школу", "wait-rus");
  html += '<p class="kicker">Разрыв</p><div class="card"><div class="gap">';
  html += bar("Математика", g.score == null ? g.prev : g.score, g.target, stale ? "цель " + g.target + " · устарел" : "цель " + g.target + " · пересчитан");
  html += bar("Русский", 78, 90, "цель 90 · 2 недели назад");
  html += '</div><p class="note">Полоска — балл к цели, которую назвал он. Устаревший разрыв не становится лучше сам.</p></div>';
  if (student()) html += '<div class="actions"><button type="button" class="ghost" data-act="own">Своя задача</button></div>';
  return html;
}

function bar(name, score, target, meta){
  const pct = Math.max(0, Math.min(100, Math.round(score / target * 100)));
  return '<div class="line"><span>' + name + '</span><span>' + meta + '</span></div>' +
    '<div class="bar" aria-hidden="true"><i style="width:' + pct + '%"></i></div>';
}

function card(o){
  let html = '<article class="card"><h2>' + o.title + '</h2>';
  if (o.result) html += '<p class="neutral" data-result="' + o.result + '">' + o.cost + '</p>';
  else if (o.cost) html += '<p>' + o.cost + '</p>';
  if (o.lock) html += '<p class="lock ' + (o.lockClass || "") + '">' + o.lock + '</p>';
  if (o.acts && o.acts.length){
    html += '<div class="actions">';
    o.acts.forEach(function(a){
      html += '<button type="button" class="' + (a[2] ? "primary" : "ghost") + '" data-act="' + a[1] + '">' + a[0] + '</button>';
    });
    html += '</div>';
  }
  html += '</article>';
  return html;
}

function row(mark, title, sub, act){
  return '<button type="button" class="row" data-act="' + act + '"><span class="mark">' + mark + '</span><span><b>' + title + '</b><span>' + sub + '</span></span></button>';
}

function timeline(){
  const g9 = S.grade === 9;
  const steps = [
    ["ВсОШ", "сентябрь, ежегодно", g9 ? "" : "", g9 ? "В этом году закрылось. Следующий школьный этап через год." : "Школьный этап этого сентября. Прошлый год в списке не висит."],
    ["Профиль и ОГЭ", "весна 9 класса", g9 ? "now" : "", g9 ? "Ты здесь. После выбора профиля предметы фиксируют перечень на два года." : "Стадия 9 класса уже позади."],
    ["Заявление на ЕГЭ", "1 февраля, 11 класс", "", "Состав предметов потом не пересобрать."],
    ["Подача и приоритеты", "окно приёмной кампании", "", "Порядок можно менять до последнего дня."],
    ["Согласие", "срок согласия этого года", "", "Дату подставим, когда она будет известна. Пропуск необратим."]
  ];
  let html = '<ol class="tl">';
  steps.forEach(function(s){
    html += '<li class="' + s[2] + '"><b>' + s[0] + '</b><span>' + s[1] + '. ' + s[3] + '</span></li>';
  });
  html += '</ol><p class="note">Между отсечками — контур подготовки. Он повторяется до даты экзамена.</p>';
  return html;
}

function doneView(){
  let html = "";
  let any = false;
  if (S.g9.done){
    any = true;
    html += '<article class="card"><span class="tag">9 класс</span><h2>Исключил направления</h2>';
    if (student() || S.g9.shared){
      if (S.g9.none) html += '<p>Пометка: ничего не отсекаю.</p>';
      S.g9.exclusions.forEach(function(e){
        html += '<p>' + esc(e.name) + ' — «' + esc(e.reason) + '»</p>';
      });
      if (student()){
        html += '<div class="actions"><button type="button" class="ghost" data-act="share">' +
          (S.g9.shared ? "Скрыть от родителя" : "Показать родителю") + '</button></div>';
      }
    } else {
      html += '<p>Содержание у школьника.</p>';
    }
    html += '</article>';
  }
  if (S.g9.subjects.length){
    any = true;
    html += '<article class="card"><span class="tag">9 класс</span><h2>Предметы ОГЭ</h2>';
    S.g9.subjects.forEach(function(s){
      html += '<p>' + esc(s.name) + (student() || s.shared ? ' — «' + esc(s.why) + '»' : '') + '</p>';
    });
    if (!student()) html += '<p>Зачем каждый предмет — у школьника, пока он сам не откроет.</p>';
    html += '</article>';
  }
  if (S.g10.score != null){
    any = true;
    const worse = S.g10.score < S.g10.prev;
    html += '<article class="card"><span class="tag">10 класс</span><h2>Пробник по математике</h2><p class="neutral">' +
      S.g10.score + ' · цель ' + S.g10.target + ' · разрыв ' + gapMath() +
      (worse ? '. Ниже прошлого замера ' + S.g10.prev + '.' : '.') + '</p></article>';
  }
  if (S.g10.hours != null){
    any = true;
    html += '<article class="card"><span class="tag">10 класс</span><h2>Объём на неделю</h2><p>' + S.g10.hours + ' ч. На следующей неделе можно снизить.</p></article>';
  }
  S.own.forEach(function(t){
    if (!t.done) return;
    if (!student() && !t.forParent) return;
    any = true;
    html += '<article class="card"><span class="tag">твоё</span><h2>' + esc(t.title) + '</h2><p>' + esc(t.result) + '</p></article>';
  });
  if (!any) html = '<p class="note">Пока пусто. Сюда попадает то, что закрылось внешним результатом: список, балл, документ.</p>';
  return html;
}

function panel(){
  const p = S.panel;
  let body = '<button type="button" class="back" data-act="close">Назад</button>';
  if (S.err) body += '<p class="err">' + esc(S.err) + '</p>';
  if (p === "ours"){
    body += '<h2>Я делаю</h2>';
    ours().forEach(function(item){
      body += '<div class="item"><b>' + item[0] + '</b><p>' + item[1] + '</p></div>';
    });
    body += '<p class="note">Эти расчёты делаем мы. У каждого есть источник и дата.</p>';
  } else if (p === "exclude"){
    body += '<h2>Куда точно не пойдёшь</h2><p class="note">Причина твоими словами. Если отсечёшь всё — шаг на этом кончается.</p>';
    body += '<div class="chips">';
    DIRS.forEach(function(d){
      const on = S.g9.exclusions.some(function(e){ return e.name === d; });
      body += '<button type="button" class="chip' + (on ? ' on' : '') + '" data-act="pick" data-dir="' + d + '">' + d + '</button>';
    });
    body += '</div>';
    if (S.pick){
      body += '<label for="reason">Почему не ' + esc(S.pick) + '</label><textarea id="reason"></textarea>';
      body += '<div class="actions"><button type="button" class="primary" data-act="add-ex">Добавить</button></div>';
    }
    S.g9.exclusions.forEach(function(e){
      body += '<div class="item"><b>' + esc(e.name) + '</b><p>«' + esc(e.reason) + '»</p></div>';
    });
    body += '<div class="actions"><button type="button" class="primary" data-act="save-ex">Сохранить список</button>';
    body += '<button type="button" class="ghost" data-act="none-ex">Ничего не отсекаю</button></div>';
  } else if (p === "notso" || p === "notso-score"){
    body += '<h2>Не так</h2><label for="why">Что не сходится</label><textarea id="why"></textarea>';
    body += '<div class="actions"><button type="button" class="primary" data-act="save-notso">Сохранить</button></div>';
  } else if (p === "detail-exclude"){
    body += '<h2>Назови, куда точно не пойдёшь</h2>';
    body += '<p>Что получится: список направлений и причина по каждому. Список можно менять.</p>';
    body += '<p>От нас: карта профилей в «Я делаю». Какой выбрать — не говорим.</p>';
    body += '<p>Как проверим: у каждого пункта есть причина. Пустой список без пометки «ничего не отсекаю» шаг не закрывает.</p>';
    body += '<p class="note">Откуда это: ранний выбор измеримо выгоден. Доклад ВШЭ.</p>';
  } else if (p === "detail-score"){
    body += '<h2>Сдай замер и обнови разрыв</h2>';
    body += '<p>Балл из пробника или тренажёра. «Я готов» не принимаем.</p>';
    body += '<p>Балл хуже предыдущего — корректный результат. Месяц без замера разрыв не улучшает.</p>';
    body += '<p>От нас: пересчёт по темам. Тренажёр называем только по проваленной теме, не потому что он подключён.</p>';
  } else if (p === "score"){
    body += '<h2>Балл пробника по математике</h2>';
    body += '<p class="note">Прошлый замер ' + S.g10.prev + ', цель ' + S.g10.target + '. Оба числа — пример.</p>';
    body += '<label for="score">Балл</label><input id="score" type="number" min="0" max="100" inputmode="numeric">';
    body += '<div class="actions"><button type="button" class="primary" data-act="save-score">Приложить</button></div>';
  } else if (p === "volume"){
    body += '<h2>Объём на неделю</h2><p class="note">Часы или задачи. Число не назначаем.</p>';
    if (!student()) body += '<p>Объём записывает школьник.</p>';
    else {
      body += '<label for="hours">Часов на этой неделе</label><input id="hours" type="number" min="0" max="40" inputmode="numeric">';
      body += '<div class="actions"><button type="button" class="primary" data-act="save-hours">Записать объём</button></div>';
    }
  } else if (p === "subjects"){
    body += '<h2>Предметы ОГЭ и зачем они</h2>';
    if (!student()){
      body += '<p>Перечень — срок, его видно. Зачем направление — у школьника.</p>';
    } else {
      body += '<label for="sub">Предмет</label><input id="sub" type="text" placeholder="например, физика">';
      body += '<label for="subwhy">Ради каких направлений</label><input id="subwhy" type="text">';
      body += '<div class="actions"><button type="button" class="primary" data-act="add-sub">Добавить предмет</button></div>';
      S.g9.subjects.forEach(function(s){
        body += '<div class="item"><b>' + esc(s.name) + '</b><p>' + esc(s.why) + '</p></div>';
      });
    }
  } else if (p === "own"){
    body += '<h2>Своя задача</h2><p class="note">В цепочку отсечки не входит.</p>';
    body += '<label for="ot">Что сделать</label><input id="ot" type="text">';
    body += '<label for="or">Какой результат закроет</label><input id="or" type="text">';
    body += '<label for="od">К какой дате, если есть</label><input id="od" type="text" placeholder="необязательно">';
    body += '<label><input id="op" type="checkbox"> Срок, деньги или документ — показать родителю</label>';
    body += '<div class="actions"><button type="button" class="primary" data-act="save-own">Добавить</button></div>';
  } else if (p === "wait-muni"){
    body += '<h2>Ждём списков школы</h2><p>Муниципальный этап. Это не твой долг и не просрочка. Когда списки появятся, напишем.</p>';
  } else if (p === "wait-rus"){
    body += '<h2>Ждём школу</h2><p>Результат пробника по русскому придёт из школы. Пока его нет, разрыв по русскому не улучшаем.</p>';
  } else if (p === "missed"){
    body += '<h2>Школьный этап закрылся</h2><p>В этом сентябре попытки нет. Следующий школьный этап через год.</p>';
  } else if (p.indexOf("own-") === 0){
    const t = S.own[Number(p.slice(4))];
    body += '<h2>' + esc(t.title) + '</h2><p>Закроет результат: ' + esc(t.result) + '</p>';
    if (student()) body += '<div class="actions"><button type="button" class="primary" data-act="done-own" data-i="' + p.slice(4) + '">Результат есть</button></div>';
    else body += '<p>Эту задачу закрывает школьник.</p>';
  }
  return '<div class="panel">' + body + '</div>';
}

function plural(n, a, b, c){
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return a;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return b;
  return c;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
  });
}

function openPanel(name){
  S.panel = name;
  S.err = "";
  render();
}

phone.addEventListener("click", function(e){
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "tab"){ S.tab = btn.dataset.tab; S.panel = null; render(); return; }
  if (act === "close"){ S.panel = null; S.pick = ""; S.err = ""; render(); return; }
  if (act === "ours"){ openPanel("ours"); return; }
  if (act === "exclude"){ if (student()) openPanel("exclude"); return; }
  if (act === "notso" || act === "notso-score"){ if (student()) openPanel(act); return; }
  if (act === "detail-exclude" || act === "detail-score"){ openPanel(act); return; }
  if (act === "score"){ if (student()) openPanel("score"); return; }
  if (act === "volume" || act === "subjects" || act === "own"){ openPanel(act); return; }
  if (act === "wait-muni" || act === "wait-rus" || act === "missed"){ openPanel(act); return; }
  if (act.indexOf("own-") === 0){ openPanel(act); return; }
  if (act === "pick"){ S.pick = btn.dataset.dir; S.err = ""; render(); return; }
  if (act === "add-ex"){
    const reason = (document.getElementById("reason").value || "").trim();
    if (!S.pick || !reason){ S.err = "Нужна причина твоими словами. Без причины шаг не выполнен."; render(); return; }
    S.g9.exclusions = S.g9.exclusions.filter(function(x){ return x.name !== S.pick; });
    S.g9.exclusions.push({name: S.pick, reason: reason});
    S.pick = "";
    S.err = "";
    render();
    return;
  }
  if (act === "save-ex"){
    if (!S.g9.exclusions.length){ S.err = "Список пуст. Добавь направление с причиной или отметь «ничего не отсекаю»."; render(); return; }
    S.g9.done = true; S.g9.none = false; S.panel = null; S.tab = "now"; render(); return;
  }
  if (act === "none-ex"){
    S.g9.none = true; S.g9.exclusions = []; S.g9.done = true; S.panel = null; render(); return;
  }
  if (act === "save-notso"){
    const why = (document.getElementById("why").value || "").trim();
    if (!why){ S.err = "Напиши, что не сходится."; render(); return; }
    if (S.panel === "notso") S.g9.rejected = why;
    else S.g10.objected = why;
    S.panel = null; S.err = ""; render(); return;
  }
  if (act === "unreject"){ S.g9.rejected = ""; render(); return; }
  if (act === "save-score"){
    const raw = document.getElementById("score").value;
    if (raw === "" || Number.isNaN(Number(raw))){ S.err = "Нужен балл из пробника или тренажёра."; render(); return; }
    S.g10.score = Number(raw); S.panel = null; render(); return;
  }
  if (act === "save-hours"){
    const raw = document.getElementById("hours").value;
    if (raw === "" || Number(raw) <= 0){ S.err = "Нужны часы или число задач. «Настроился» не считается."; render(); return; }
    S.g10.hours = Number(raw); S.panel = null; render(); return;
  }
  if (act === "add-sub"){
    const name = document.getElementById("sub").value.trim();
    const why = document.getElementById("subwhy").value.trim();
    if (!name || !why){ S.err = "Предмет без связи с направлением шаг не закрывает."; render(); return; }
    S.g9.subjects.push({name: name, why: why});
    S.err = ""; render(); return;
  }
  if (act === "save-own"){
    const title = document.getElementById("ot").value.trim();
    const result = document.getElementById("or").value.trim();
    const date = document.getElementById("od").value.trim();
    const forParent = document.getElementById("op").checked;
    if (!title || !result){ S.err = "Назови, что сделать и какой результат это закроет."; render(); return; }
    S.own.push({title: title, result: result, date: date, forParent: forParent, done: false});
    S.panel = null; render(); return;
  }
  if (act === "done-own"){
    S.own[Number(btn.dataset.i)].done = true; S.panel = null; render(); return;
  }
  if (act === "share"){ S.g9.shared = !S.g9.shared; render(); }
});

document.getElementById("gradeSeg").addEventListener("click", function(e){
  const b = e.target.closest("[data-grade]");
  if (!b) return;
  S.grade = Number(b.dataset.grade);
  S.panel = null;
  S.tab = "now";
  render();
});
document.getElementById("whoSeg").addEventListener("click", function(e){
  const b = e.target.closest("[data-who]");
  if (!b) return;
  S.who = b.dataset.who;
  S.panel = null;
  render();
});

render();
</script>
</body>
</html>
