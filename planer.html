<style>
/* Теги. «Срок» и «Предметы» покрашены как в макете.
   Остальные — оттенки той же тёмной схемы, сверить с палитрой макета:
   Разговор зелёный, Ждём серый, Отсев фиолетовый, Списки голубой,

:root{
  --bg:#07080c;
  --phone:#0e1016;
  --card:#1a1e28;
  --card-2:#161a24;
  --line:#2a3040;
  --text:#f4f6fb;
  --text-2:#a7adba;
  --text-3:#7e8696;
  --blue:#3b74ff;
  --green:#3ecf8e;
  --weekend:#ff5d73;
  --pill:#1a1e28;
  --pill-on:#3a4154;
  --tag-срок:#e08a3c;
  --tag-предметы:#5b8cff;
  --tag-разговор:#3ecf8e;
  --tag-ждём:#8b93a7;
  --tag-отсев:#b08cff;
  --tag-списки:#5ec8e0;
  --tag-деньги:#e0b05a;
  --tag-вуз:#5b8cff;
  --tag-документы:#aeb6c6;
  --tag-олимпиада:#e0b05a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stage{min-height:100vh;display:flex;flex-direction:row;align-items:flex-start;justify-content:center;gap:24px;padding:20px 16px 32px}
.side{width:320px;flex:0 0 320px;position:sticky;top:20px}
.banner{width:auto;margin:0}
.banner p{margin:0 0 10px;font-size:13px;line-height:1.4;color:var(--text-3)}
.segs{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;padding:3px;background:var(--pill);border:1px solid var(--line);border-radius:999px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:6px 8px;font-size:13px;color:var(--text-2)}
.seg button.on{background:var(--pill-on);color:var(--text);font-weight:650}
.phone{position:relative;width:390px;height:844px;background:var(--phone);border:1px solid #222838;border-radius:32px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.scroll{height:100%;overflow:auto;padding:14px 0 96px}
.phone.event .scroll{padding-bottom:28px}
.phone.event .tabs{display:none}
.scroll::-webkit-scrollbar{width:0}
.switch{display:flex;margin:0 16px 14px;padding:4px;background:#141824;border-radius:14px}
.switch button{flex:1;border:0;background:transparent;color:#c5cad6;border-radius:11px;padding:8px;font-size:15px}
.switch button.on{background:#3a4154;color:#fff;font-weight:650}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.plan{position:relative;flex:0 0 86%;scroll-snap-align:start;background:var(--card);border-radius:18px;padding:14px 16px 16px}
.plan.skipped h2,.plan.skipped .sub{opacity:.45}
.plan.skipped h2{text-decoration:line-through}
.eye{margin:0 72px 8px 0;font-size:13px;color:var(--text-2)}
.plan h2{margin:0 0 6px;font-size:26px;line-height:1.15;font-weight:720;letter-spacing:-.02em}
.sub{margin:0;color:var(--text-2);font-size:15px}
.dashes{position:absolute;top:16px;right:14px;display:flex;gap:4px}
.dashes i{width:14px;height:4px;border-radius:2px;background:#343b4d}
.dashes i.on{background:var(--green)}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:10px 16px;font-weight:650;font-size:15px}
.btn.ghost{background:#2a3142;color:var(--text)}
.btn:disabled{opacity:.45}
.btn.wide{width:100%;border-radius:14px;padding:14px 16px;font-size:16px}
.month{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.month h2{margin:0;font-size:32px;font-weight:720;letter-spacing:-.03em}
.month .nav{display:flex;gap:8px}
.round{width:36px;height:36px;border-radius:50%;border:0;background:#1c2230;color:var(--text);display:grid;place-items:center;padding:0}
.round svg,.cond svg,.why svg,.tabs svg{width:20px;height:20px;display:block}
.days{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 10px 4px}
.day{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;color:#d7dbe6}
.day .wd{font-size:12px;color:var(--text-2);text-transform:lowercase}
.day.we .wd{color:var(--weekend)}
.day.on .wd{color:#fff}
.day .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#171b26;font-weight:680}
.day.on .num{background:var(--blue);color:#fff}
.dot{width:4px;height:4px;border-radius:50%;background:transparent}
.day.has .dot{background:var(--blue)}
.day.on.has .dot{background:#fff}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px 10px}
.dayhead h3{margin:0;font-size:20px;font-weight:700}
.dayhead span{color:var(--text-3);font-size:14px;white-space:nowrap}
.tasks{padding:0 16px}
.task{display:grid;grid-template-columns:68px 1fr;gap:8px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:0;margin:0 0 10px}
.when{padding-top:12px;font-size:13px;color:var(--text-2)}
.when b{display:block;font-weight:650;color:var(--text)}
.tcard{display:block;background:var(--card);border-radius:16px;padding:12px 14px 12px 12px;border-left:3px solid var(--tag,var(--blue))}
.tcard b{display:block;font-size:16px;line-height:1.3;font-weight:680}
.tcard span{display:block;margin-top:4px;font-size:14px;color:var(--text-2)}
.tag{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:999px;font-size:12px;font-style:normal;background:color-mix(in srgb,var(--tag) 22%,transparent);color:var(--tag)}
.task.wait .tcard{opacity:.8}
.empty{margin:8px 16px;padding:22px 16px;background:var(--card);border-radius:16px;text-align:center}
.empty p{margin:0 0 14px;color:var(--text-2)}
.ebar{display:flex;padding:4px 12px 0}
.ek{margin:8px 16px 0;font-size:13px;color:var(--text-2)}
.event h1{margin:8px 16px 12px;font-size:30px;line-height:1.15;font-weight:740;letter-spacing:-.03em}
.plate{display:flex;gap:14px;align-items:center;margin:0 16px 8px;padding:14px 16px;border-radius:18px;background:linear-gradient(100deg,#2f6bff 0%,#6a4dff 58%,#8a5cff 100%);color:#fff}
.plate.wait{background:#232838}
.plate.past{background:#2a2228}
.badge{flex:0 0 52px;text-align:center}
.badge b{display:block;font-size:32px;line-height:1;font-weight:740}
.badge span{font-size:13px;opacity:.9}
.plate > div b{display:block;font-size:18px;font-weight:720}
.plate > div span{display:block;margin-top:2px;font-size:14px;opacity:.92}
.conds{margin:8px 16px}
.cond{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.cond svg{flex:0 0 22px;color:var(--text-3);margin-top:1px}
.cond b{display:block;font-weight:650}
.cond span{display:block;margin-top:2px;color:var(--text-2);font-size:14px}
.why{margin:8px 16px 0;padding:14px 16px;background:var(--card-2);border-radius:16px}
.why h3{margin:0 0 10px;font-size:16px}
.why ul{list-style:none;margin:0;padding:0}
.why li{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px}
.why li:last-child{margin:0}
.why svg{flex:0 0 20px;color:var(--green);margin-top:1px}
.foot{display:flex;justify-content:space-between;gap:12px;margin:16px 16px 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--text-2);font-size:14px}
.event .btn.wide{margin:0 16px;width:calc(100% - 32px)}
.flash{margin:12px 16px 0;font-size:13px;color:var(--text-2)}
.board{position:relative;height:560px;margin:8px 12px 0;border-radius:18px;overflow:hidden;
  background:linear-gradient(#143628 0 38%, #1a5670 38% 52%, #10281f 52% 100%)}
.bridge{position:absolute;z-index:2;left:50%;top:37%;width:44px;height:16%;transform:translateX(-50%);border-radius:4px;
  background:repeating-linear-gradient(#8a7b68 0 8px,#6e6254 8px 10px);box-shadow:6px 0 0 #3d342c,-6px 0 0 #3d342c}
.bridge span{position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#f4e4bc}
.crumb{position:absolute;z-index:1;width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;background:#e6c15a;box-shadow:0 0 6px #e6c15a}
.pin,.stop{position:absolute;z-index:3;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;color:inherit}
.pin{display:flex;flex-direction:column;align-items:center;gap:3px}
.pin i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(#e6c15a calc(var(--p) * 1%), #3a2a16 0);border:2px solid #f0d48a}
.pin i b{width:24px;height:24px;border-radius:50%;background:#24180e;color:#f6e7c1;display:grid;place-items:center;font-size:10px;font-weight:700}
.pin em,.stop em{font-style:normal;font-size:10px;line-height:1.15;background:#f4e4bc;color:#3a2c12;padding:2px 6px;border-radius:2px;white-space:nowrap}
.pin.on i{box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.stop{display:flex;align-items:center;gap:6px;transform:translate(-14px,-50%)}
.stop.flip{flex-direction:row-reverse;transform:translate(calc(-100% + 14px),-50%)}
.stop i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;
  background:#5a3b16;border:2px solid #e6c15a;color:#f6e7c1}
.stop.now i{background:#3b74ff;border-color:#c5d4ff;color:#fff}
.stop.done i{background:#1f6b45;border-color:#3ecf8e}
.stop.later{opacity:.5}
.stop.on em{box-shadow:0 0 0 2px #fff}
.fills{list-style:none;margin:8px 16px 0;padding:12px 14px;background:var(--card);border-radius:16px}
.fills li{margin:0 0 8px;font-size:14px;color:var(--text-2)}
.fills li:last-child{margin:0}
.fills li.done{color:var(--text)}
.maphint{margin:8px 16px 0;font-size:13px;color:var(--text-2)}
.tabs{position:absolute;left:16px;right:16px;bottom:14px;display:flex;background:rgba(22,26,36,.92);border:1px solid var(--line);border-radius:22px;padding:8px 0 6px;backdrop-filter:blur(12px)}
.tabs button{flex:1;border:0;background:transparent;color:var(--text-3);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{color:#fff}
@media (max-width:900px){
  .stage{flex-direction:column;align-items:center}
  .side{position:static;width:min(390px,100%)}
}
@media (max-width:480px){
  .stage{padding:0}
  .banner{width:100%;padding:12px 12px 0}
  .phone{width:100%;height:100dvh;border:0;border-radius:0}
}
</style>

<script>
function typo(s){
  if (typeof s !== "string") return s;
  s = s.replaceAll(" — ", "\u00a0— ");
  s = s.replaceAll("им. Баумана", "им.\u00a0Баумана");
  s = s.replaceAll("м. Бауманская", "м.\u00a0Бауманская");
  s = s.replaceAll("Н. Э. ", "Н.\u00a0Э.\u00a0");
  for (let i = 0; i < 4; i++){
    const n = s.replace(/(^|[\s\u00a0(«])([ВвКкСсУуОоАаИиЯя]) /g, (m, a, b) => a + b + "\u00a0");
    if (n === s) break;
    s = n;
  }
  return s;
}
function walk(v){
  if (typeof v === "string") return typo(v);
  if (Array.isArray(v)) return v.map(walk);
  if (v && typeof v === "object"){
    const o = {};
    for (const k of Object.keys(v)) o[k] = walk(v[k]);
    return o;
  }
  return v;
}
function indexSet(set){
  set.tasks.forEach(t => { t.key = t.day + "|" + t.title; });
  return set;
}

function deeds(n){

}
function esc(s){

function dashes(step){
  const m = /^(\d+) из (\d+)$/.exec(step);
  if (!m) return "";
  const cur = Number(m[1]), total = Number(m[2]);
  let html = "";
  for (let i = 1; i <= total; i++) html += `<i class="${i <= cur ? "on" : ""}"></i>`;
  return `<span class="dashes">${html}</span>`;
}

function crumbs(){
  const pts = [[38,34],[50,37],[50,53],[66,68],[32,86]];
  let html = "";
  for (let i = 0; i < pts.length - 1; i++){
    for (let t = 0; t <= 1; t += 0.2){
      const x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t;
      const y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t;
      html += `<i class="crumb" style="left:${x}%;top:${y}%"></i>`;
    }
  }
  return html;
}
function renderMap(view){
  const map = mapOf(view);
  if (S.ring && !map.rings.some(r => r.id === S.ring)) S.ring = "";
  const pins = map.rings.map(r => {
    const at = PIN_AT[r.id];
    const on = S.step === "" && S.ring === r.id;
    return `<button type="button" class="pin${on ? " on" : ""}" data-act="ring" data-ring="${r.id}" aria-pressed="${on}" style="left:${at[0]};top:${at[1]}" aria-label="${esc(r.name)}, ${r.pct}%">
      <i style="--p:${r.pct}"><b>${r.pct}</b></i><em>${esc(r.name)}</em>
    </button>`;
  }).join("");
  const stops = map.line.map((s, i) => {
    const at = STOP_AT[i];
    const on = String(S.step) === String(i);
    return `<button type="button" class="stop ${s.state}${at[2] ? " flip" : ""}${on ? " on" : ""}" data-act="step" data-step="${i}" aria-pressed="${on}" style="left:${at[0]};top:${at[1]}">
      <i>${i + 1}</i><em>${esc(s.title)}</em>

  }).join("");
  let below = `<p class="maphint">На нашем берегу пять точек и выбор предметов. Через мост — сдача ЕГЭ и подача.</p>`;
  if (S.step !== ""){
    const s = map.line[Number(S.step)];
    below = `<p class="maphint"><b>${esc(s.title)}.</b> ${esc(s.text)}</p>`;
  } else if (S.ring){
    const ring = map.rings.find(r => r.id === S.ring);
    const items = ring.items.map(it => `<li class="${it.done ? "done" : ""}">${it.done ? "●" : "○"} ${esc(it.text)}</li>`).join("");
    below = `<ul class="fills">${items}</ul>`;
  }
  return `${switcher()}
    <div class="board" aria-label="Карта">
      ${crumbs()}
      <div class="bridge"><span>мост</span></div>
      ${pins}
      ${stops}
    </div>
    ${below}`;
}

function taskCard(t){

  </button>`;
}

function specOf(view){
  const o = S.opened;
  if (!o) return null;
  if (o.kind === "set") return {ev: view.event, off: view.event.state === "ждём"};
  if (o.kind === "task"){
    const task = view.tasks.find(t => t.key === o.key);
    const plan = view.plans.find(p => p.task === task.title);
    const soon = task.dur ? task.when : task.when;
    const ev = {
      state: task.state === "ждём" ? "ждём" : "запись открыта",
      kicker: plan ? `План №${plan.n} · ${plan.step}` : "",
      title: task.title,
      day:"", month:"",
      soon: task.when,
      close: task.dur || task.source,
      rows: task.dur ? [[task.when + ", " + task.dur, ""], [task.source, ""]] : [[task.source, ""]],
      why: [],
      foot: "",
      button: plan ? plan.b1 : "Открыть"
    };
    return {ev, off: task.state === "ждём" || ev.button === "Готово"};
  }
  const plan = view.plans[o.i];
  return {ev:{
    state: plan.step === "ждём" ? "ждём" : "запись открыта",
    kicker:`План №${plan.n} · ${plan.step}`,
    title: plan.title, day:"", month:"", soon: plan.sub, close:"",
    rows:[], why:[], foot:"", button: plan.b1
  }, off: plan.step === "ждём" || plan.b1 === "Готово"};
}
function renderEvent(view){
  const {ev, off} = specOf(view);
  const plateCls = ev.state === "ждём" ? "wait" : ev.state === "срок прошёл" ? "past" : "";
  const badge = ev.day && ev.day !== "—" ? `<div class="badge"><b>${esc(ev.day)}</b><span>${esc(ev.month)}</span></div>` : "";
  const icons = ["cal","pin","ticket"];
  const rows = (ev.rows || []).map((r, i) => `<div class="cond">${icon(icons[i] || "cal")}<div><b>${esc(r[0])}</b>${r[1] ? `<span>${esc(r[1])}</span>` : ""}</div></div>`).join("");
  const why = ev.why && ev.why.length
    ? `<section class="why"><h3>Почему тебе</h3><ul>${ev.why.map(w => `<li>${icon("check")}<span>${esc(w)}</span></li>`).join("")}</ul></section>`
    : "";
  const foot = ev.foot ? `<div class="foot"><span>${esc(ev.foot)}</span></div>` : "";
  return `<div class="event">
    <div class="ebar"><button type="button" class="round" data-act="back" aria-label="Назад">${icon("back")}</button></div>
    ${ev.kicker ? `<p class="ek">${esc(ev.kicker)}</p>` : ""}

    ${S.flash ? `<p class="flash">${esc(S.flash)}</p>` : ""}
  </div>`;
}

function render(){
  const view = current();
  const eventOn = S.screen === "event" && S.opened;
  document.querySelector(".phone").classList.toggle("event", !!eventOn);
  renderBanner();
  document.getElementById("app").innerHTML = eventOn ? renderEvent(view) : S.screen === "map" ? renderMap(view) : renderPlaner(view);
  renderTabs();
}

document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const view = current();
  const act = el.dataset.act;
  if (act === "set"){
    S.setId = el.dataset.id; S.day = null; if (S.screen === "event") S.screen = "planer"; S.opened = null; S.flash = "";
  } else if (act === "mode"){
    S.mode = el.dataset.mode; S.day = null; if (S.screen === "event") S.screen = "planer"; S.opened = null; S.flash = ""; S.skipped = {};
  } else if (act === "month"){
    const ids = SETS.map(s => s.id);
    let i = ids.indexOf(S.setId) + Number(el.dataset.dir);
    i = (i + ids.length) % ids.length;
    S.setId = ids[i]; S.day = null; S.screen = "planer"; S.opened = null; S.flash = "";
  } else if (act === "day"){
    S.day = Number(el.dataset.day); S.screen = "planer"; S.flash = "";
  } else if (act === "task"){
    const task = view.tasks.find(t => t.key === el.dataset.key);
    S.opened = task.event === "set" ? {kind:"set"} : {kind:"task", key: task.key};
    S.screen = "event"; S.flash = "";
  } else if (act === "plan"){
    const i = Number(el.dataset.i);
    const plan = view.plans[i];
    if (el.dataset.btn === "2"){
      const k = view.id + "|" + plan.n;
      S.skipped[k] = !S.skipped[k];
    } else if (plan.event === "set"){
      S.opened = {kind:"set"}; S.screen = "event"; S.flash = "";
    } else if (plan.task){
      const task = view.tasks.find(t => t.title === plan.task);
      if (!task) return;
      S.opened = task.event === "set" ? {kind:"set"} : {kind:"task", key: task.key};
      S.screen = "event"; S.flash = "";
    } else {
      S.opened = {kind:"plan", i}; S.screen = "event"; S.flash = "";
    }
  } else if (act === "back"){
    S.screen = "planer"; S.flash = "";
  } else if (act === "map" || (act === "tab" && el.dataset.tab === "map")){
    S.screen = "map"; S.opened = null; S.flash = "";
  } else if (act === "ring"){
    S.ring = el.dataset.ring; S.step = ""; S.flash = "";
  } else if (act === "step"){
    S.step = el.dataset.step; S.flash = "";
  } else if (act === "tab" && (el.dataset.tab === "planer" || el.dataset.tab === "plan")){
    S.screen = "planer"; S.flash = "";
  } else if (act === "tab"){
    S.flash = typo("Этот переход в прототипе не собран.");
  } else if (act === "eventbtn"){
    S.flash = typo("Дальше этот прототип не идёт.");
  }
  render();
});

render();
</script>
</body>
</html>
