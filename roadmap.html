<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Роадмап · помощник</title>
<meta name="description" content="Карта показывает всю цель. Дела появляются, когда согласишься в разговоре сбоку.">
<style>
:root{
  --bg:#07080c;--phone:#0e1016;--card:#1a1e28;--card-2:#161a24;--line:#2a3040;
  --text:#f4f6fb;--text-2:#a7adba;--text-3:#7e8696;--blue:#3b74ff;--green:#3ecf8e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;gap:24px;padding:20px 16px 32px}
.side{width:320px;flex:0 0 320px;position:sticky;top:20px}
.banner p{margin:0;font-size:13px;line-height:1.4;color:var(--text-3)}
.phone{position:relative;display:flex;flex-direction:column;width:390px;height:844px;background:var(--phone);border:1px solid #222838;border-radius:32px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.scroll{flex:1;min-height:0;overflow:auto;padding:14px 0 12px}
.phone.port .dock{display:none}
.scroll::-webkit-scrollbar{width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 16px 4px}
.top h1{margin:0;font-size:26px;letter-spacing:-.03em;font-weight:720}
.top button{border:0;background:transparent;color:var(--text-2);font-size:14px;padding:4px}
.hint{margin:0 16px 8px;color:var(--text-2);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 8px}
.chip{border:1px solid var(--line);background:#1c2230;border-radius:999px;padding:8px 12px;font-size:14px}
.goals{display:flex;justify-content:space-between;align-items:flex-start;margin:2px 12px 12px;position:relative}
.goals::before{content:"";position:absolute;top:22px;left:16%;right:16%;border-top:2px dashed #3a4258}
.goal{position:relative;z-index:1;width:112px;border:0;background:transparent;color:inherit;text-align:center;padding:0}
.goal i{width:44px;height:44px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--blue);background:#141824;display:grid;place-items:center;font-style:normal;font-weight:720}
.goal.on i{background:var(--blue);color:#fff}
.goal b{display:block;font-size:12px;font-weight:650;line-height:1.2}
.goal span{display:block;margin-top:2px;font-size:10px;line-height:1.2;color:var(--text-3)}
.board{position:relative;margin:0 6px}
.road{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.segrow{position:relative;z-index:1;display:flex;align-items:flex-start;gap:6px;padding:2px 4px 2px 0}
.weeks{flex:1;min-width:0}
.week{display:flex;align-items:flex-start;gap:8px;min-height:64px}
.wn{flex:0 0 52px;text-align:right;font-size:11px;line-height:1.15;color:var(--text-3);padding-top:8px}
.wn b{display:block;font-size:15px;font-weight:720;color:var(--text-2);letter-spacing:-.02em}
.wn span{display:block}
.wn button{display:block;margin:2px 0 0 auto;border:0;background:transparent;padding:0;font-size:11px;font-weight:650;color:#e0b05a}
.lane{flex:1;display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;justify-content:flex-start;gap:14px;min-height:52px;min-width:0;padding:4px 0 8px 6px}
.seglab{margin:8px 0 0 22px;font-size:12px;color:var(--text-3)}
.emptycap{margin:0 0 6px 22px;font-size:12px;color:var(--text-3)}
.cell{position:relative;z-index:2;flex:0 0 48px;width:48px;height:48px;padding:0;border-radius:14px;border:2px solid var(--c,#5b8cff);background:#12151c;color:var(--c);display:grid;place-items:center}
.cell svg{width:22px;height:22px;display:block}
.cell.empty{border-style:dashed;border-color:#3a4258;background:transparent;color:transparent}
.bubbles{flex:0 0 116px;width:116px;display:flex;flex-direction:column;gap:6px;padding-top:8px}
.bubble{width:100%;border:1px dashed #e0b05a;background:#16140e;border-radius:14px;padding:8px;text-align:left;color:inherit}
.bubble b{display:block;font-size:12px;font-weight:650;line-height:1.25}
.bubble .off{display:block;margin-top:6px;border:0;background:transparent;color:#e0b05a;padding:0;font-size:12px;font-weight:650}
.bubble.back{border-style:dotted;background:transparent;color:var(--text-3);font-size:12px;padding:6px 8px}
.milewrap{position:relative;z-index:1;padding:2px 8px 8px 22px}
.cell.mile{flex:1 1 auto;width:100%;height:auto;min-height:64px;display:block;text-align:left;padding:8px 12px;border-color:#8b93a7;color:inherit;background:var(--card)}
.cell.mile .kicker{display:block;font-size:11px;color:var(--text-3);margin-bottom:2px}
.cell.mile b{display:block;font-size:16px;line-height:1.2;letter-spacing:-.02em}
.cell.mile .sub{display:block;margin-top:2px;font-size:12px;color:var(--text-2);font-weight:450}
.cell.mile.now{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,116,255,.35)}
.cell.mile.now .kicker{color:#9db7ff}
.cell.mile.passed{border-color:var(--green)}
.cell.mile.passed .kicker{color:var(--green)}
.cell.mile.later{opacity:.45}
.dock{flex:none;display:flex;gap:8px;align-items:center;margin:0 12px 8px;padding:6px 8px;background:#141820;border:1px solid var(--line);border-radius:14px}
.dock .lab{flex:0 0 auto;font-size:12px;color:var(--text-3);padding:0 4px}
.dock .row{display:flex;gap:8px;overflow:auto;scrollbar-width:none}
.dock .row::-webkit-scrollbar{display:none}
.mini{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:12px;padding:6px 10px;text-align:left}
.mini b{display:block;font-size:13px}
.mini span{display:block;font-size:12px;color:var(--text-2)}
.tabs{flex:none;display:flex;margin:0 12px 12px;background:#161a24;border:1px solid var(--line);border-radius:22px;padding:8px 0 6px}
.tabs button{flex:1;border:0;background:transparent;color:var(--text-3);font-size:13px;padding:6px}
.tabs button.on{color:#fff;font-weight:650}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;overflow:auto;background:#141820;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px 28px;z-index:4}
.sheet h2{margin:0 40px 8px 0;font-size:22px;letter-spacing:-.02em}
.sheet .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border:0;border-radius:50%;background:#1c2230}
.sheet p{margin:0 0 12px;color:var(--text-2);font-size:15px}
.sheet .msg{max-width:88%;margin:0 0 8px;padding:10px 12px;border-radius:16px;font-size:15px;line-height:1.35}
.sheet .msg.bot{background:#1c2230;color:var(--text);border-bottom-left-radius:4px}
.sheet .msg.me{margin-left:auto;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;font-weight:650;font-size:14px}
.btn.ghost{background:#2a3142;color:var(--text)}
.cards{padding:0 16px}
.card{background:var(--card);border-left:3px solid #aeb6c6;border-radius:16px;padding:14px;margin:0 0 10px}
.card b{display:block;font-size:16px}
.card span{display:block;margin-top:4px;color:var(--text-2);font-size:14px}
.flash{margin:0 16px 8px;font-size:13px;color:var(--text-2)}
.feathers{font-size:13px;font-weight:650;color:#e0b05a}
.fogband{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;margin:4px 12px 4px 22px;min-height:150px;padding:12px 12px 14px;border-radius:16px;background:linear-gradient(180deg, rgba(14,16,22,0) 0%, rgba(22,28,44,.78) 48%, rgba(14,16,22,.92) 100%)}
.fogband p{margin:0;font-size:13px;color:var(--text-3)}
.fogband button{align-self:flex-start;border:0;background:transparent;padding:0;font-size:13px;color:var(--text-2);text-decoration:underline;text-underline-offset:3px}
.coach{position:absolute;left:16px;right:16px;z-index:6;background:#1a1e28;border:1px solid var(--blue);border-radius:16px;padding:12px 14px 14px;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:coachin .2s ease both}
.coach p{margin:0 28px 10px 0;font-size:15px;line-height:1.35}
.coach .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:#1c2230}
.coach::before{content:"";position:absolute;left:var(--ax,28px);top:-7px;width:12px;height:12px;background:#1a1e28;border-left:1px solid var(--blue);border-top:1px solid var(--blue);transform:translateX(-50%) rotate(45deg)}
.coach.above::before{top:auto;bottom:-7px;border:0;border-right:1px solid var(--blue);border-bottom:1px solid var(--blue)}
@keyframes coachin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cell.done{border-color:var(--green)}
.tick{position:absolute;right:-5px;bottom:-5px;width:16px;height:16px;border-radius:50%;background:var(--green);color:#062116;display:grid;place-items:center}
.tick svg{width:11px;height:11px}
.choice{display:block;width:100%;margin:0 0 8px;border:1px solid var(--line);background:#1c2230;border-radius:14px;padding:12px 14px;text-align:left;font-size:15px;line-height:1.3}
.sheet input{display:block;width:100%;margin:0 0 8px;border:1px solid var(--line);background:#1c2230;color:inherit;border-radius:12px;padding:10px 12px;font:inherit}
.sheet .err{margin:0 0 8px;color:#e06c9a;font-size:13px}
.storyline{margin:0;color:#e0b05a;font-weight:650}
.phone.start #app{display:flex;flex-direction:column;overflow:hidden}
.phone.start .board{flex:1;display:flex;flex-direction:column;min-height:0}
.phone.start .fogband{flex:1 1 auto;min-height:120px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cell.pop{animation:rise .18s ease both;animation-delay:calc(var(--d) * 40ms)}
@keyframes fogback{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.fogband.retreat{animation:fogback .45s ease both}
@media (prefers-reduced-motion:reduce){
  .cell.pop,.fogband.retreat,.coach{animation:none}
}
@media (max-width:900px){
  html,body{height:100%}
  body{overflow:hidden}
  .stage{height:100dvh;min-height:0;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:12px 0 0;overflow:hidden}
  .side{position:static;width:min(390px,100%);flex:0 1 auto;padding:0 16px}
  .phone{width:min(390px,100%);height:auto;flex:1 1 auto;min-height:0;border-radius:28px 28px 0 0}
}
@media (max-width:480px){
  .stage{gap:0;padding:0}
  .side{width:100%;padding:10px 16px 4px}
  .phone{width:100%;border:0;border-radius:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="stage">
  <aside class="side banner" id="banner"></aside>
  <div class="phone" id="phone">
    <div class="scroll" id="app"></div>
    <div class="dock" id="dock"></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>
<script>
function typo(s){
  if (typeof s !== "string") return s;
  s = s.replaceAll(" — ", "\u00a0— ");
  for (let i = 0; i < 4; i++){
    const n = s.replace(/(^|[\s\u00a0(«])([ВвКкСсУуОоАаИиЯя]) /g, (m, a, b) => a + b + "\u00a0");
    if (n === s) break;
    s = n;
  }
  return s;
}
function walk(v){
  if (typeof v === "string") return typo(v);
  if (Array.isArray(v)) return v.map(walk);
  if (v && typeof v === "object"){
    const o = {};
    for (const k of Object.keys(v)) o[k] = walk(v[k]);
    return o;
  }
  return v;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

const NOTE = typo("Сначала одно дело: построить план. Дальше туман, в конце поступление. Дела появляются после ответа и ложатся на недели.");

const COLOR = {
  подготовка:"#5b8cff", лента:"#4ec9e0", профилирование:"#8b7cf0", проба:"#3ecf8e",
  отсев:"#e06c9a", вуз:"#e08a3c", документы:"#aeb6c6", олимпиада:"#e0b05a"
};
const ACT = walk({
  подготовка:{label:"Открыть тренажёр", done:"Тренажёр открыт."},
  лента:{label:"Смотреть", done:"Ролик открыт."},
  профилирование:{label:"Пройти тест", done:"Тест открыт."},
  проба:{label:"Посмотреть день", done:"День открыт."},
  отсев:{label:"Написать", done:"Можно писать."},
  вуз:{label:"Открыть вуз", done:"Карточка вуза открыта."},
  документы:{label:"Загрузить", done:"Можно загрузить файл."},
  олимпиада:{label:"Готовиться", done:"Подготовка открыта."}
});
const ICO = {
  подготовка:'<rect x="7" y="3.5" width="11" height="17" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 8h11M10.5 3.5v17M13 11.5h3M13 14.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  лента:'<path d="M9 7.2v9.6l8.2-4.8L9 7.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  профилирование:'<path d="M8 7.2 9.6 8.8 13 5.6M8 12.7 9.6 14.3 13 11.1M8 18.2 9.6 19.8 13 16.6M15 8h4M15 13.5h4M15 19h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  проба:'<path d="M2.8 12S6.6 6.6 12 6.6 21.2 12 21.2 12 17.4 17.4 12 17.4 2.8 12 2.8 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.1" fill="currentColor"/>',
  отсев:'<circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.4 16.6 16.6 7.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  вуз:'<path d="M4 9.5 12 4l8 5.5M6 9.5V20M10 9.5V20M14 9.5V20M18 9.5V20M4 20h16M4 9.5h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  документы:'<path d="M4 8h6l2 2h8v8.2a1.8 1.8 0 0 1-1.8 1.8H5.8A1.8 1.8 0 0 1 4 18.2V8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  олимпиада:'<path d="M9 3.5h6l-1.1 6.2h-3.8L9 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="15.2" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  check:'<path d="M6 12.4 10 16.2 18 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
};
function ico(name){ return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICO[name] || ""}</svg>`; }

const CASE = {биология:"биологии", химия:"химии", информатика:"информатике", математика:"математике"};
const SUBJECTS = ["биология","химия","информатика","математика"];

const MILES = walk([
  {n:1, title:"Выбрал профессию", proof:"Направление названо твоими словами"},
  {n:2, title:"Подготовился к экзаменам", proof:"250 на пробниках"},
  {n:3, title:"Сдал экзамены", proof:"Баллы из официальных результатов"},
  {n:4, title:"Подготовил документы", proof:"Комплект по каждому вузу"},
  {n:5, title:"Подал заявление", proof:"Заявление на Госуслугах, приоритеты твои"},
  {n:6, title:"Поступил", proof:"Согласие подано в срок"}
]);

const OFFERS = walk([
  {id:"job", q:"Помочь выбрать профессию?", on:"Смотрим направления", pick:false,
    text:"Помогу посмотреть направления. Профессию за тебя не назову. Чаще выбирают направление, не вуз: 52% и 22%. Две недели, по два дела.",
    weeks:2, per:2, pool:[
      {type:"лента", title:"Три ролика", text:"Посмотри три коротких ролика про разные направления. Запиши, что не твоё."},
      {type:"профилирование", title:"Тест", text:"Пройди тест. Запиши своими словами, что не твоё и что пока оставляешь."},
      {type:"проба", title:"Обычный день", text:"Посмотри, как проходит рабочий день. Напиши: оставить или нет, и почему."},
      {type:"отсев", title:"Куда не пойду", text:"Напиши направление и почему оно не твоё."}
    ]},
  {id:"subj", q:"Помочь с предметами?", on:"Разбираем предметы", pick:false,
    text:"Покажу, какие предметы что открывают. Назовёшь их сам. Четыре недели, по два дела.",
    weeks:4, per:2, pool:[
      {type:"подготовка", title:"Что открывает предмет", text:"Открой связку: предмет, какие направления он держит."},
      {type:"отсев", title:"Что не нужно", text:"Вычеркни предмет, который тебе не нужен, и напиши почему."},
      {type:"профилирование", title:"Ещё тест", text:"Пройди тест ещё раз. Снова запиши, что оставляешь."},
      {type:"лента", title:"Ролики про предмет", text:"Посмотри ролики про то, как предмет выглядит в учёбе."},
      {type:"вуз", title:"День открытых дверей", text:"Сходи посмотреть. Это не выбор вуза."},
      {type:"подготовка", title:"Назови предметы", text:"Напиши предметы своими словами. Мы их не подставим."},
      {type:"проба", title:"День с этим предметом", text:"Посмотри, как выглядит учёба, где этот предмет главный."},
      {type:"отсев", title:"Проверь список", text:"Ещё раз пройди по списку. Лишнее вычеркни."}
    ]},
  {id:"prep", q:"Помочь подготовиться к ЕГЭ?", on:"Готовимся к ЕГЭ", pick:true,
    text:"ЕГЭ — основной путь. Так зачисляют 62,3%. Четыре недели, по три дела.",
    weeks:4, per:3, pool:[
      {type:"подготовка", title:"Пробник", text:"Реши пробник по своему предмету. Балл возьмём из результата."},
      {type:"подготовка", title:"Одна тема", text:"Разбери тему, где на пробнике ошибся."},
      {type:"лента", title:"Ролик", text:"Короткий ролик по теме, которую разбираешь."},
      {type:"подготовка", title:"Час задач", text:"Порешай задачи час. Сколько в неделю — решаешь ты."},
      {type:"подготовка", title:"Ещё час", text:"Второе занятие на этой неделе."},
      {type:"профилирование", title:"Короткий тест", text:"Проверь тему. Без проверки не видно, стало ли лучше."},
      {type:"подготовка", title:"Ошибки", text:"Разбери ошибки прошлого пробника. Балл ниже — это просто балл."},
      {type:"подготовка", title:"Второй предмет", text:"Занятие по второму предмету из твоего списка."},
      {type:"лента", title:"Ещё ролик", text:"Ролик по второй теме."},
      {type:"подготовка", title:"Короткая проверка", text:"Короткая проверка перед следующим пробником."},
      {type:"подготовка", title:"Ещё задачи", text:"Ещё задачи по той же теме."},
      {type:"подготовка", title:"Пробник ещё раз", text:"Второй пробник. Сравним с первым."}
    ]},
  {id:"olymp", q:"Олимпиада?", on:"Олимпиада", pick:true,
    text:"Есть олимпиады. Диплом даёт баллы или снимает конкурс целиком. Так зачисляют 3,6%. Две недели, по два дела.",
    weeks:2, per:2, pool:[

function plan(){ return SCEN.find(p => p.id === S.planId) || null; }
function view(){
  const p = plan();
  if (!p) return null;
  const passed = p.passed.slice();
  let at = p.at;
  let lead = p.lead;
  if (S.direction && !passed.includes(1)){
    passed.push(1);
    if (at < 2) at = 2;
    if (p.at === 1) lead = "Направление названо. Дальше предметы.";
  }
  return {id:p.id, at:at, passed:passed, filled:p.filled, lead:lead};
}
function mileState(n){
  const p = view();
  if (!p) return "later";
  if (p.passed.includes(n)) return "passed";
  if (n === p.at) return "now";
  return "later";
}
function featherWord(n){
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return n + " пёрышко";
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return n + " пёрышка";
  return n + " пёрышек";
}
function featherHtml(){
  if (!S.feathers) return "";
  return `<span class="feathers">${esc(featherWord(S.feathers))}</span>`;
}
function modeOf(id){
  const o = S.offer[id];
  if (o && o.state === "out") return "out";
  if (o && o.state === "on") return "on";
  if (o && o.state === "ask") return "ask";
  const p = plan();
  if (p && p.filled.includes(id)) return "on";
  return "ask";
}
function subjectOf(id){
  const o = S.offer[id];
  return (o && o.subject) || "";
}
function egeAlt(){
  const g = S.place && S.place.grade;
  return (g && EGE_ALT[g]) || null;
}
function onLabel(b){
  const alt = b.id === "ege" ? egeAlt() : null;
  if (alt) return alt.on;
  const sub = subjectOf(b.id);
  if (sub && (b.id === "olymp" || b.id === "prep")) return b.on + " по " + (CASE[sub] || sub);
  return b.on;
}
function egeFlash(){
  const g = S.place.grade;
  if (g === "8") return "До ОГЭ ещё год. На карте — что открывают предметы.";
  if (g === "9") return "ЕГЭ в этом году не подают. На карте — предметы к ОГЭ.";
  if (g === "10") return "Запись откроется в 11 классе. На карте — состав предметов.";
  return "Добавил запись на ЕГЭ.";
}

function offerShape(b){
  const alt = b.id === "ege" ? egeAlt() : null;
  return {
    weeks: alt ? alt.weeks : b.weeks,
    per: alt ? alt.per : b.per,
    pool: alt ? alt.pool : b.pool,
    label: onLabel(b)
  };
}
function weekTasks(b, w){
  const sh = offerShape(b);
  const tasks = [];
  for (let i = 0; i < sh.per; i++){
    const src = sh.pool[(w * sh.per + i) % sh.pool.length];
    const cell = Object.assign({id:b.id + "-" + w + "-" + i, week:w}, src);
    if (b.id === "olymp" && subjectOf(b.id)){
      const sub = subjectOf(b.id);
      cell.title = cell.title + ", " + sub;
      cell.text = "Готовься по " + (CASE[sub] || sub) + ". Предмет выбрал ты.";
    }
    tasks.push(cell);
  }
  return tasks;
}
function taskCell(c){
  const color = COLOR[c.type] || "#5b8cff";
  INDEX[c.id] = c;
  const fresh = !S.seen[c.id];
  if (fresh) newborn.push(c.id);
  const cls = "cell" + (S.done[c.id] ? " done" : "") + (fresh ? " pop" : "");
  const style = "--c:" + color + (fresh ? ";--d:" + (popN++) : "");
  const tick = S.done[c.id] ? `<i class="tick" aria-hidden="true">${ico("check")}</i>` : "";
  return `<button type="button" class="${cls}" style="${style}" data-act="cell" data-id="${esc(c.id)}" aria-label="${esc(c.title)}">${ico(c.type)}${tick}</button>`;
}
function onOffers(){
  const p = view();
  if (!p) return [];
  const seg = SEGMENTS.find(s => s.id === p.at);
  return seg.offers.filter(id => modeOf(id) === "on").map(id => OFFER[id]);
}
function mergedWeeks(offers){
  const n = offers.reduce((m, b) => Math.max(m, offerShape(b).weeks), 0);
  const weeks = [];
  for (let w = 0; w < n; w++){
    const tasks = [];
    offers.forEach(b => {
      if (w < offerShape(b).weeks) tasks.push(...weekTasks(b, w));
    });
    weeks.push(tasks);
  }
  return weeks;
}
let spotted = false;
function weeksHtml(){
  const offers = onOffers();
  const weeks = mergedWeeks(offers);
  if (!weeks.length) return `<p class="emptycap">Дел пока нет</p>`;
  const labels = offers.map(b => offerShape(b).label).join(" · ");
  let html = `<p class="seglab">${esc(labels)}</p>`;
  weeks.forEach((tasks, w) => {
    const closed = tasks.every(t => S.done[t.id]);
    const key = "w-" + w;
    const spot = S.sheet === "onboard" && !spotted;
    if (spot) spotted = true;
    const story = closed ? `<button type="button" data-act="story" data-id="${esc(key)}">Смотреть</button>` : "";
    html += `<div class="week${spot ? " spot" : ""}"><div class="wn"><b>${w + 1}</b><span>${closed ? "готова" : "неделя"}</span>${story}</div><div class="lane">${tasks.map(taskCell).join("")}</div></div>`;
  });
  return html;
}

    const ask = `<div class="msg bot">${esc(typo("Готов выбрать?"))}</div>`;
    if (S.dirStep !== "answer"){
      body = `${ask}<div class="btns"><button type="button" class="btn" data-act="dir-yes">Да</button><button type="button" class="btn ghost" data-act="dir-no">Не сейчас</button></div>`;
    } else {
      const err = S.dirError ? `<p class="err">${esc(typo(S.dirError))}</p>` : "";
      body = `${ask}<div class="msg me">Да</div><div class="msg bot">${esc(typo("Напиши своими словами. Профессию за тебя не назовём."))}</div>
        <input id="dir" type="text" maxlength="80" autocomplete="off" placeholder="Своими словами">
        ${err}
        <button type="button" class="btn" data-act="save-dir">Ответить</button>`;
    }
  } else if (state === "passed"){
    body += S.direction && m.n === 1 ? `<p>${esc(S.direction)}</p>` : "";
    body += `<p>Пройдено.</p>`;
  } else if (FACT[m.n]){
    body += `<p>${esc(FACT[m.n])}</p>`;
  }
  return `<div class="sheet" role="dialog" aria-label="${esc(m.title)}">
    <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
    <h2>${esc(m.title)}</h2>
    ${body}
  </div>`;
}
function renderBuild(){
  return `<div class="sheet" role="dialog" aria-label="Построить план">
    <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
    <h2>Построить план</h2>
    <p>${esc(typo("Два ответа. От него зависит, какие дела появятся."))}</p>
    <button type="button" class="choice" data-act="pick-plan" data-id="none">Пока не знаю, помоги определиться</button>
    <button type="button" class="choice" data-act="pick-plan" data-id="field">Область знаю, предметы нет</button>
  </div>`;
}
function renderOnboard(){
  return `<div class="coach" role="dialog" aria-label="Как идти по карте">
    <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
    <p>${esc(typo("Выполняй задания и двигайся к цели."))}</p>
    <button type="button" class="btn" data-act="onboard-ok">Понятно</button>
  </div>`;
}
function placeCoach(){
  const phone = document.getElementById("phone");
  const coach = phone && phone.querySelector(".coach");
  const cell = phone && phone.querySelector(".week.spot .cell");
  if (!coach || !cell) return;
  const scroller = document.getElementById("app");
  const pr0 = phone.getBoundingClientRect();
  const cr0 = cell.getBoundingClientRect();
  if (cr0.top < pr0.top + 48 || cr0.bottom > pr0.bottom - 80) scroller.scrollTop += cr0.top - pr0.top - 88;
  const pr = phone.getBoundingClientRect();
  const cr = cell.getBoundingClientRect();
  const coachH = coach.offsetHeight;
  let top = cr.bottom - pr.top + 16;
  let above = false;
  if (top + coachH > pr.height - 8){
    top = cr.top - pr.top - coachH - 16;
    above = true;
  }
  coach.style.top = Math.max(8, top) + "px";
  coach.classList.toggle("above", above);
  const ax = cr.left + cr.width / 2 - pr.left - 16;
  const max = coach.clientWidth - 18;
  coach.style.setProperty("--ax", Math.max(18, Math.min(max, ax)) + "px");
}
function renderAhead(){
  const p = view();
  const rest = MILES.filter(m => !p || m.n > p.at);
  const items = rest.map(m => `<p><b>${esc(m.title)}</b> ${esc(m.proof)}</p>`).join("");
  return `<div class="sheet" role="dialog" aria-label="Что дальше">
    <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
    <h2>Что дальше</h2>
    ${items}
  </div>`;
}
function renderStory(key){
  const w = Number(String(key).split("-").pop());
  const tasks = mergedWeeks(onOffers())[w] || [];
  const names = tasks.map(t => t.title).join(", ");
  return `<div class="sheet" role="dialog" aria-label="Неделя ${w + 1}">
    <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
    <h2>Неделя ${w + 1}</h2>
    <p>${esc(typo("За эту неделю: " + names + "."))}</p>
    <p class="storyline">+3 пёрышка</p>
  </div>`;
}
function askSheet(title, text, chipsHtml){
  return `<div class="sheet" role="dialog" aria-label="${esc(title)}">
    <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
    <h2>${esc(title)}</h2>
    <p>${esc(typo(text))}</p>
    <div class="chips">${chipsHtml}</div>
  </div>`;
}
function renderTalk(){
  const b = OFFER[S.talk];
  if (!b) return "";
  if (S.talkStep === "grade"){
    const chips = ["8","9","10","11"].map(s => `<button type="button" class="chip" data-act="grade" data-val="${s}">${s} класс</button>`).join("");
    return askSheet("Какой класс?", "От класса зависит, что делать сейчас: предметы к ОГЭ или запись на ЕГЭ.", chips);
  }
  if (S.talkStep === "city"){
    const chips = CITIES.map(s => `<button type="button" class="chip" data-act="city" data-val="${esc(s)}">${esc(s)}</button>`).join("");
    return askSheet("Какой город?", "Сроки региона и комплект бумаг возьмём отсюда.", chips);
  }
  if (b.pick && S.talkStep === "pick"){
    const chips = SUBJECTS.map(s => `<button type="button" class="chip" data-act="subject" data-id="${esc(b.id)}" data-val="${esc(s)}">${esc(s)}</button>`).join("");
    return `<div class="sheet" role="dialog" aria-label="Предмет">
      <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
      <h2>Какой предмет?</h2>
      <p>${esc(typo("Выбери сам. По нему встанут недели на карте."))}</p>
      <div class="chips">${chips}</div>
    </div>`;
  }
  return `<div class="sheet" role="dialog" aria-label="${esc(b.q)}">
    <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
    <h2>${esc(b.q.replace("?", ""))}</h2>
    <p>${esc(b.text)}</p>
    <div class="btns">
      <button type="button" class="btn" data-act="talk-yes" data-id="${esc(b.id)}">Давай</button>
      <button type="button" class="btn ghost" data-act="talk-no" data-id="${esc(b.id)}">Не сейчас</button>
    </div>
  </div>`;
}
function renderSheet(){
  if (S.talk) return renderTalk();
  if (!S.sheet) return "";
  if (S.sheet === "build") return renderBuild();
  if (S.sheet === "onboard") return renderOnboard();
  if (S.sheet === "ahead") return renderAhead();
  if (String(S.sheet).startsWith("story-")) return renderStory(String(S.sheet).slice(6));
  if (String(S.sheet).startsWith("mile-")) return renderMileSheet(INDEX[S.sheet]);
  if (String(S.sheet).startsWith("help-")) return renderHelp(String(S.sheet).slice(5));
  const c = INDEX[S.sheet];
  if (!c) return "";
  return renderTaskSheet(c);
}

function renderHelp(id){
  const h = HELP[id];
  if (!h) return "";
  return `<div class="sheet" role="dialog" aria-label="${esc(h.q)}">
    <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
    <h2>${esc(h.q)}</h2>
    <p>${esc(h.text)}</p>
    <div class="btns">
      <button type="button" class="btn" data-act="help-yes" data-id="${esc(id)}">${esc(h.yes)}</button>
      <button type="button" class="btn ghost" data-act="help-no">Не сейчас</button>
    </div>
  </div>`;
}
function renderTabs(){
  const items = [["road","Роадмап"],["port","Портфель"]];
  document.getElementById("tabs").innerHTML = items.map(([id, label]) =>
    `<button type="button" data-act="tab" data-id="${id}" class="${S.screen === id ? "on" : ""}">${label}</button>`).join("");
}

function drawRoad(){
  const board = document.getElementById("board");
  const svg = document.getElementById("road");
  if (!board || !svg) return;
  const nodes = [...board.querySelectorAll(".cell")];
  if (nodes.length < 2) return;
  const br = board.getBoundingClientRect();
  const w = board.clientWidth, h = board.clientHeight;
  const pts = nodes.map(n => {
    const r = n.getBoundingClientRect();
    return {x: r.left + r.width / 2 - br.left, y: r.top + r.height / 2 - br.top};
  });
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length; i++){
    const a = pts[i - 1], b = pts[i];
    const dy = (b.y - a.y) * 0.55;
    d += ` C ${a.x} ${a.y + dy}, ${b.x} ${b.y - dy}, ${b.x} ${b.y}`;
  }
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="#3a4258" stroke-width="18" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#8b93a7" stroke-width="2" stroke-dasharray="7 9" stroke-linecap="round"/>`;
}

function render(){
  const phone = document.getElementById("phone");
  phone.classList.toggle("port", S.screen === "port");
  phone.classList.toggle("start", S.screen === "road" && !plan());
  const app = document.getElementById("app");
  newborn.length = 0;
  if (S.screen === "port") app.innerHTML = renderPort();
  else app.innerHTML = renderRoad();
  newborn.forEach(id => { S.seen[id] = true; });
  document.getElementById("dock").innerHTML = renderDock();
  renderTabs();
  renderBanner();
  phone.querySelectorAll(".sheet,.coach").forEach(n => n.remove());
  if ((S.sheet || S.talk) && S.screen === "road") phone.insertAdjacentHTML("beforeend", renderSheet());
  if (S.screen === "road") requestAnimationFrame(() => requestAnimationFrame(() => { drawRoad(); placeCoach(); }));
}

function turnOn(id){
  S.offer[id] = {state:"on", subject: subjectOf(id)};
  S.talk = null;
  S.flash = id === "ege" && S.place ? egeFlash() : "Добавил на карту: " + OFFER[id].on + ".";
}

document.body.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (S.sheet === "onboard" && act !== "onboard-ok" && act !== "close") S.onboarded = true;
  if (act === "build-open"){
    S.sheet = "build";
    S.talk = null;
  } else if (act === "pick-plan"){
    S.planId = el.dataset.id;
    S.talk = null;
    S.flash = "";
    S.sheet = S.onboarded ? null : "onboard";
  } else if (act === "onboard-ok"){
    S.onboarded = true;
    S.sheet = null;
  } else if (act === "ahead"){
    S.sheet = "ahead";
    S.talk = null;
  } else if (act === "story"){
    const key = el.dataset.id;
    if (!S.told[key]){
      S.told[key] = true;
      S.feathers += 3;
    }
    S.sheet = "story-" + key;
    S.talk = null;
  } else if (act === "dir-yes"){
    S.dirStep = "answer";
    S.dirError = "";
  } else if (act === "dir-no"){
    S.dirStep = "ask";
    S.sheet = null;
  } else if (act === "save-dir"){
    const input = document.getElementById("dir");
    const v = input ? input.value.trim() : "";
    if (!v) S.dirError = "Напиши направление своими словами.";
    else {
      S.direction = v;
      S.dirError = "";
      S.dirStep = "ask";
      S.fogRetreat = true;
      S.sheet = null;
      S.flash = "Записал: " + v + ".";
    }
  } else if (act === "tab"){
    S.screen = el.dataset.id;
    S.sheet = null;
    S.talk = null;
  } else if (act === "cell"){
    S.sheet = el.dataset.id;
    S.talk = null;
    S.flash = "";
  } else if (act === "mile"){
    S.sheet = "mile-" + el.dataset.id;
    S.talk = null;
    S.flash = "";
    if (el.dataset.id === "1") S.dirStep = "ask";
  } else if (act === "empty"){
    S.sheet = null;
    S.talk = null;
    S.flash = "Дел пока нет. Спроси помощника сбоку.";
  } else if (act === "close"){
    if (S.sheet === "onboard") S.onboarded = true;
    S.sheet = null;
    S.talk = null;
    S.draftGrade = "";
    S.dirStep = "ask";
  } else if (act === "do"){
    if (S.sheet) S.done[S.sheet] = true;
    S.flash = el.dataset.msg;
    S.sheet = null;
  } else if (act === "talk"){
    S.talk = el.dataset.id;
    S.talkStep = "pitch";
    S.sheet = null;
    S.flash = "";
  } else if (act === "talk-yes"){
    const b = OFFER[el.dataset.id];
    if (PLACE_OFFERS[b.id] && !S.place) S.talkStep = "grade";
    else if (b.pick) S.talkStep = "pick";
    else turnOn(b.id);
  } else if (act === "grade"){
    S.draftGrade = el.dataset.val;
    S.talkStep = "city";
  } else if (act === "city"){
    S.place = {grade:S.draftGrade, city:el.dataset.val};
    S.draftGrade = "";
    const id = S.talk;
    const tail = id === "ege" ? egeFlash() : "Добавил на карту: " + OFFER[id].on + ".";
    turnOn(id);
    S.flash = S.place.grade + " класс, " + S.place.city + ". " + tail;
  } else if (act === "talk-no"){
    S.offer[el.dataset.id] = {state:"out", subject:""};
    S.talk = null;
    S.flash = "Убрал. Вернуть можно.";
  } else if (act === "subject"){
    S.offer[el.dataset.id] = {state:"on", subject:el.dataset.val};
    S.talk = null;
    S.flash = "Добавил на карту по " + (CASE[el.dataset.val] || el.dataset.val) + ".";
  } else if (act === "help"){
    S.sheet = "help-" + el.dataset.id;
    S.talk = null;
    S.flash = "";
  } else if (act === "help-yes"){
    const h = HELP[el.dataset.id];
    if (h && h.card && !CARDS.some(c => c.id === h.card.id)) CARDS.push(h.card);
    S.helped[el.dataset.id] = true;
    S.sheet = null;
    S.flash = h ? h.done : "";
  } else if (act === "help-no"){
    S.sheet = null;
  } else if (act === "offer-off"){
    S.offer[el.dataset.id] = {state:"ask", subject:""};
    S.talk = null;
    S.flash = "Убрал с карты.";
  } else if (act === "offer-back"){
    S.offer[el.dataset.id] = {state:"ask", subject:""};
    S.flash = "";
  }
  render();
});

window.addEventListener("resize", () => { if (S.screen === "road") drawRoad(); });
render();
</script>
</body>
</html>
