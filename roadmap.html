<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Роадмап · помощник</title>
<meta name="description" content="Три сценария на три месяца. На поле значки, задание открывается по нажатию.">
<style>
:root{
  --bg:#07080c;--phone:#0e1016;--card:#1a1e28;--card-2:#161a24;--line:#2a3040;
  --text:#f4f6fb;--text-2:#a7adba;--text-3:#7e8696;--blue:#3b74ff;--green:#3ecf8e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;gap:24px;padding:20px 16px 32px}
.side{width:320px;flex:0 0 320px;position:sticky;top:20px}
.banner p{margin:0;font-size:13px;line-height:1.4;color:var(--text-3)}
.phone{position:relative;display:flex;flex-direction:column;width:390px;height:844px;background:var(--phone);border:1px solid #222838;border-radius:32px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.scroll{flex:1;min-height:0;overflow:auto;padding:14px 0 12px}
.phone.chat .scroll{padding-bottom:24px}
.phone.chat .tabs,.phone.chat .dock,.phone.port .dock{display:none}
.scroll::-webkit-scrollbar{width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 16px 4px}
.top h1{margin:0;font-size:26px;letter-spacing:-.03em;font-weight:720}
.top button{border:0;background:transparent;color:var(--text-2);font-size:14px;padding:4px}
.hint{margin:0 16px 8px;color:var(--text-2);font-size:13px}
.msg{max-width:84%;margin:0 16px 10px;padding:10px 12px;border-radius:16px}
.msg.me{margin-left:auto;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.bot{background:var(--card);border-bottom-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 8px}
.chip,.go{border:1px solid var(--line);background:#1c2230;border-radius:999px;padding:8px 12px;font-size:14px}
.go{display:block;margin:8px 16px 0;background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650;text-align:center}
.goals{display:flex;justify-content:space-between;align-items:flex-start;margin:2px 12px 12px;position:relative}
.goals::before{content:"";position:absolute;top:22px;left:16%;right:16%;border-top:2px dashed #3a4258}
.goal{position:relative;z-index:1;width:112px;border:0;background:transparent;color:inherit;text-align:center;padding:0}
.goal i{width:44px;height:44px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--blue);background:#141824;display:grid;place-items:center;font-style:normal;font-weight:720}
.goal.on i{background:var(--blue);color:#fff}
.goal b{display:block;font-size:12px;font-weight:650;line-height:1.2}
.goal span{display:block;margin-top:2px;font-size:10px;line-height:1.2;color:var(--text-3)}
.board{position:relative;margin:0 6px}
.road{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.month{position:relative;z-index:1;margin:10px 14px 0;font-size:12px;color:var(--text-3)}
.week{position:relative;z-index:1;display:flex;align-items:center;gap:6px;min-height:72px;padding:4px 6px 4px 2px}
.wn{flex:0 0 18px;font-size:11px;color:var(--text-3);text-align:right}
.lane{flex:1;display:flex;align-items:center;justify-content:space-evenly;min-width:0;min-height:48px}
.lane.flip{flex-direction:row-reverse}
.lane.n1{justify-content:flex-start;padding-left:22px}
.lane.n1.flip{justify-content:flex-end;padding-left:0;padding-right:22px}
.cell{flex:0 0 48px;width:48px;height:48px;padding:0;border-radius:14px;border:2px solid var(--c,#5b8cff);background:transparent;color:var(--c);display:grid;place-items:center}
.cell svg{width:22px;height:22px;display:block}
.cell.done{background:var(--c);color:#0e1016}
.cell.now{box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 55%, transparent)}
.cell.sil{border-style:dashed}
.cell.sil svg{opacity:.4}
.cell.fog{border:1px dashed #3a4258;background:var(--phone);color:transparent}
.bubble{flex:0 0 108px;width:108px;border:1px dashed #e0b05a;background:#16140e;border-radius:14px;padding:8px;text-align:left;color:inherit}
.bubble b{display:block;font-size:12px;font-weight:650;line-height:1.25}
.bubble .off{display:block;margin-top:6px;border:0;background:transparent;color:#e0b05a;padding:0;font-size:12px;font-weight:650}
.week.mile{min-height:0;padding:6px 8px 4px 26px}
.cell.mile{flex:1 1 auto;width:auto;height:auto;min-height:64px;display:block;text-align:left;padding:8px 12px;border-color:#e0b05a;color:inherit;background:var(--card);box-shadow:0 0 0 4px rgba(224,176,90,.22)}
.cell.mile .kicker{display:block;font-size:11px;color:#e0b05a;margin-bottom:2px}
.cell.mile b{display:block;font-size:16px;line-height:1.2;letter-spacing:-.02em}
.cell.mile .sub{display:block;margin-top:2px;font-size:12px;color:var(--text-2);font-weight:450}
.fogcap{position:relative;z-index:1;margin:6px 14px 0;font-size:13px;color:var(--text-3)}
.dock{flex:none;display:flex;gap:8px;align-items:center;margin:0 12px 8px;padding:6px 8px;background:#141820;border:1px solid var(--line);border-radius:14px}
.dock .lab{flex:0 0 auto;font-size:12px;color:var(--text-3);padding:0 4px}
.dock .row{display:flex;gap:8px;overflow:auto;scrollbar-width:none}
.dock .row::-webkit-scrollbar{display:none}
.mini{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:12px;padding:6px 10px;text-align:left}
.mini b{display:block;font-size:13px}
.mini span{display:block;font-size:12px;color:var(--text-2)}
.tabs{flex:none;display:flex;margin:0 12px 12px;background:#161a24;border:1px solid var(--line);border-radius:22px;padding:8px 0 6px}
.tabs button{flex:1;border:0;background:transparent;color:var(--text-3);font-size:13px;padding:6px}
.tabs button.on{color:#fff;font-weight:650}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;overflow:auto;background:#141820;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px 28px;z-index:4}
.sheet h2{margin:0 40px 8px 0;font-size:22px;letter-spacing:-.02em}
.sheet .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border:0;border-radius:50%;background:#1c2230}
.sheet p{margin:0 0 12px;color:var(--text-2);font-size:15px}
.sheet .done{color:var(--green);font-weight:650}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;font-weight:650;font-size:14px}
.btn.ghost{background:#2a3142;color:var(--text)}
.cards{padding:0 16px}
.card{background:var(--card);border-left:3px solid #aeb6c6;border-radius:16px;padding:14px;margin:0 0 10px}
.card b{display:block;font-size:16px}
.card span{display:block;margin-top:4px;color:var(--text-2);font-size:14px}
.flash{margin:0 16px 8px;font-size:13px;color:var(--text-2)}
@media (max-width:900px){
  .stage{flex-direction:column;align-items:center}
  .side{position:static;width:min(390px,100%)}
}
@media (max-width:480px){
  .stage{padding:0}
  .banner{width:100%;padding:12px 12px 0}
  .phone{width:100%;height:100dvh;border:0;border-radius:0}
}
</style>
</head>
<body>
<div class="stage">
  <aside class="side banner" id="banner"></aside>
  <div class="phone" id="phone">
    <div class="scroll" id="app"></div>
    <div class="dock" id="dock"></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>
<script>
function typo(s){
  if (typeof s !== "string") return s;
  s = s.replaceAll(" — ", "\u00a0— ");
  for (let i = 0; i < 4; i++){
    const n = s.replace(/(^|[\s\u00a0(«])([ВвКкСсУуОоАаИиЯя]) /g, (m, a, b) => a + b + "\u00a0");
    if (n === s) break;
    s = n;
  }
  return s;
}
function walk(v){
  if (typeof v === "string") return typo(v);
  if (Array.isArray(v)) return v.map(walk);
  if (v && typeof v === "object"){
    const o = {};
    for (const k of Object.keys(v)) o[k] = walk(v[k]);
    return o;
  }
  return v;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

const NOTE = typo("Три сценария на три месяца. На поле значок и цвет. Нажми — задание и одна кнопка. Вопросы помощника сбоку, не на дороге. Дальше поля — туман.");

const COLOR = {
  подготовка:"#5b8cff",
  лента:"#4ec9e0",
  профилирование:"#8b7cf0",
  проба:"#3ecf8e",
  отсев:"#e06c9a",
  вуз:"#e08a3c",
  документы:"#aeb6c6",
  олимпиада:"#e0b05a"
};

const ACT = walk({
  подготовка:{label:"Открыть тренажёр", done:"Тренажёр открыт."},
  лента:{label:"Смотреть", done:"Ролик открыт."},
  профилирование:{label:"Пройти тест", done:"Тест открыт."},
  проба:{label:"Посмотреть день", done:"День открыт."},
  отсев:{label:"Написать", done:"Можно писать."},
  вуз:{label:"Открыть вуз", done:"Карточка вуза открыта."},
  документы:{label:"Загрузить", done:"Можно загрузить файл."},
  олимпиада:{label:"Готовиться", done:"Подготовка открыта."}
});

const ICO = {
  подготовка:'<rect x="7" y="3.5" width="11" height="17" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 8h11M10.5 3.5v17M13 11.5h3M13 14.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  лента:'<path d="M9 7.2v9.6l8.2-4.8L9 7.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  профилирование:'<path d="M8 7.2 9.6 8.8 13 5.6M8 12.7 9.6 14.3 13 11.1M8 18.2 9.6 19.8 13 16.6M15 8h4M15 13.5h4M15 19h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  проба:'<path d="M2.8 12S6.6 6.6 12 6.6 21.2 12 21.2 12 17.4 17.4 12 17.4 2.8 12 2.8 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.1" fill="currentColor"/>',
  отсев:'<circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.4 16.6 16.6 7.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  вуз:'<path d="M4 9.5 12 4l8 5.5M6 9.5V20M10 9.5V20M14 9.5V20M18 9.5V20M4 20h16M4 9.5h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  документы:'<path d="M4 8h6l2 2h8v8.2a1.8 1.8 0 0 1-1.8 1.8H5.8A1.8 1.8 0 0 1 4 18.2V8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  олимпиада:'<path d="M9 3.5h6l-1.1 6.2h-3.8L9 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="15.2" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  check:'<path d="M6 12.4 10 16.2 18 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
};

function ico(name){
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICO[name] || ""}</svg>`;
}

const CASE = walk({биология:"биологии", химия:"химии", информатика:"информатике", математика:"математике"});

const DATA = walk({
  none:{
    id:"none", n:1, name:"не знаю предметы", per:"1 задание в неделю", count:1,
    lead:"Одно дело в неделю: ролики, тест, день открытых дверей.",
    pattern:[
      {type:"лента", title:"Три ролика", text:"Посмотри три коротких ролика про разные направления. Запиши, что не твоё."},
      {type:"проба", title:"Обычный день", text:"Посмотри, как проходит рабочий день. Напиши: оставить или нет, и почему."},
      {type:"отсев", title:"Куда не пойду", text:"Напиши направление и почему оно не твоё."},
      {type:"вуз", title:"День открытых дверей", text:"Запишись и сходи. Это чтобы посмотреть, не чтобы выбрать вуз."}
    ],
    pins:{
      "2-0":{type:"профилирование", title:"Тест профди", text:"Пройди тест. Запиши своими словами, что не твоё и что пока оставляешь."},
      "6-0":{type:"вуз", title:"День открытых дверей", text:"Запишись и сходи посмотреть вуз."}
    },
    mile:{title:"5 вычеркнул, 2 оставил", note:"Твои слова", text:"Пять направлений ты вычеркнул, два оставил."}
  },
  subjects:{
    id:"subjects", n:2, name:"выбираю предметы", per:"3 задания в неделю", count:3,
    lead:"Два раза в неделю готовься к ЕГЭ. Третье дело — ролик или тест.",
    prep:[
      {type:"подготовка", title:"Пробник", text:"Реши пробник по своему предмету. Балл возьмём из результата."},
      {type:"подготовка", title:"Одна тема", text:"Разбери тему, где на пробнике ошибся."},
      {type:"подготовка", title:"Час задач", text:"Порешай задачи час. Сколько в неделю — решаешь ты."},
      {type:"подготовка", title:"Ещё час", text:"Второе занятие на этой неделе."},
      {type:"подготовка", title:"Ошибки", text:"Разбери ошибки прошлого пробника. Балл ниже — это просто балл."},
      {type:"подготовка", title:"Второй предмет", text:"Занятие по второму предмету из твоего списка."},
      {type:"подготовка", title:"Короткая проверка", text:"Короткая проверка по теме. Без неё не видно, стало ли лучше."},
      {type:"подготовка", title:"Ещё задачи", text:"Ещё задачи по той же теме."}
    ],
    third:[
      {type:"лента", title:"Ролики", text:"Посмотри ролики про направления, которые ещё рассматриваешь."},
      {type:"профилирование", title:"Ещё тест", text:"Пройди тест ещё раз. Снова запиши, что не твоё и что оставляешь."}
    ],
    pins:{},
    mile:{title:"250 баллов", note:"Три пробника", text:"Сумма трёх пробников."}
  },
  vuz:{
    id:"vuz", n:3, name:"выбираю вуз", per:"2 задания в неделю", count:2,
    lead:"Два дела в неделю: вуз и бумаги.",
    left:[
      {type:"вуз", title:"Вуз в список", text:"Добавь вуз и направление. Сколько строк — решаешь ты."},
      {type:"вуз", title:"Правила приёма", text:"Открой правила приёма. Смотри дату на сайте вуза."},
      {type:"вуз", title:"Проходные", text:"Посмотри проходные прошлых лет. Это не твой будущий балл."},
      {type:"вуз", title:"Ещё вуз", text:"Добавь ещё один вуз, если он тебе нужен."}
    ],
    right:[
      {type:"вуз", title:"День открытых дверей", text:"Запишись на день открытых дверей вуза из своего списка."},
      {type:"документы", title:"Одна бумага", text:"Собери одну бумагу для вуза из списка."}
    ],
    pins:{},
    mile:{title:"5 вузов", note:"Список и бумаги", text:"Пять вузов в списке и бумаги к ним."}
  }
});

const CARDS = walk([
  {id:"oge-doc", title:"Запись на ОГЭ", meta:"Справка школы", note:"Справка из школы. Галочка её не заменяет."},
  {id:"mock", title:"Математика, 68", meta:"Пробник", note:"Балл из пробника. Ниже прошлого — просто балл."}
]);

const SCRIPT = walk([
  {text:"Соберу план на три месяца.", key:"place", q:"Где ты учишься?", chips:["9 класс, Москва"]},
  {text:"На чём ты сейчас?", key:"known", q:"", chips:["Не знаю, помоги выбрать","Направление есть, предметы нет","Предметы есть, нужен вуз"]},
  {text:"Сколько минут в день готов заниматься?", key:"mins", q:"", chips:["15 минут","30 минут","Час"]},
  {text:"План на три месяца готов. С пятой недели значки без заданий. В конце число, дальше туман.", go:true}
]);

const SUBJECTS = ["биология","химия","информатика","математика"];
const OFFER_WEEK = 1;
const SCEN_LIST = [DATA.none, DATA.subjects, DATA.vuz];
const S = {
  built:false, screen:"chat", turn:0, answers:{}, planId:"none",
  offer:{olymp:{state:"ask", subject:""}, target:{state:"ask", subject:""}},
  talk:null, talkStep:"pitch", sheet:null, flash:""
};
let INDEX = {};

function plan(){ return DATA[S.planId]; }
function offerKey(){
  if (S.planId === "subjects") return "olymp";
  if (S.planId === "vuz") return "target";
  return "";
}
function weekState(w){
  if (w === 0) return "done";
  if (w === 1) return "now";
  if (w < 4) return "open";
  return "sil";
}
function cellSrc(sc, w, i){
  const pin = sc.pins[w + "-" + i];
  if (pin) return pin;
  if (sc.count === 1) return sc.pattern[w % sc.pattern.length];
  if (sc.id === "subjects") return i < 2 ? sc.prep[(w * 2 + i) % sc.prep.length] : sc.third[w % sc.third.length];
  return i === 0 ? sc.left[w % sc.left.length] : sc.right[w % sc.right.length];
}
function extraCell(sc, w){
  if (w < OFFER_WEEK + 1 || w >= OFFER_WEEK + 5) return null;
  if (sc.id === "subjects" && S.offer.olymp.state === "on"){
    const sub = S.offer.olymp.subject;
    return {type:"олимпиада", title:"Олимпиада, " + sub, text:"Готовься к школьному этапу по " + (CASE[sub] || sub) + "."};
  }
  if (sc.id === "vuz" && S.offer.target.state === "on"){
    return {type:"документы", title:"Целевой договор", text:"Договор и бумаги ведём мы. Куда идти — выбираешь ты."};
  }
  return null;
}
function weeksOf(sc){
  const weeks = [];
  for (let w = 0; w < 12; w++){
    const row = [];
    for (let i = 0; i < sc.count; i++){
      const cell = Object.assign({id:sc.id + "-" + w + "-" + i, week:w}, cellSrc(sc, w, i));
      INDEX[cell.id] = cell;
      row.push(cell);
    }
    const extra = extraCell(sc, w);
    if (extra){
      const cell = Object.assign({id:sc.id + "-" + w + "-x", week:w}, extra);
      INDEX[cell.id] = cell;
      row.push(cell);
    }
    weeks.push(row);
  }
  const mile = Object.assign({id:sc.id + "-mile", kind:"mile"}, sc.mile);
  INDEX[mile.id] = mile;
  return {weeks, mile};
}

function renderBanner(){
  document.getElementById("banner").innerHTML = `<p>${esc(NOTE)}</p>`;
}

function renderChat(){
  const lines = [`<div class="msg me">Сделай мне план, как в вуз поступить.</div>`];
  const n = Math.min(S.turn, SCRIPT.length - 1);
  for (let i = 0; i <= n; i++){
    const step = SCRIPT[i];
    if (i < S.turn && S.answers[step.key]){
      lines.push(`<div class="msg bot">${esc(step.text)}</div>`);
      lines.push(`<div class="msg me">${esc(S.answers[step.key])}</div>`);
    } else if (i === S.turn){
      lines.push(`<div class="msg bot">${esc(step.text)}${step.q ? " " + esc(step.q) : ""}</div>`);
    }
  }
  let extra = "";
  if (!S.built){
    const step = SCRIPT[S.turn];
    extra = step.go
      ? `<button type="button" class="go" data-act="build">Показать дорогу</button>`
      : `<div class="chips">${step.chips.map(c => `<button type="button" class="chip" data-act="chip" data-key="${esc(step.key)}" data-val="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
  } else {
    const a = S.answers;
    lines.length = 0;
    lines.push(`<div class="msg me">Сделай мне план, как в вуз поступить.</div>`);
    lines.push(`<div class="msg me">${esc(a.place || "")}. ${esc(a.known || "")}. В день: ${esc(a.mins || "—")}.</div>`);
    lines.push(`<div class="msg bot">${esc(SCRIPT[3].text)}</div>`);
    extra = `<button type="button" class="go" data-act="tab" data-id="road">К дороге</button>`;
  }
  return `<div class="top"><h1>Помощник</h1></div>${lines.join("")}${extra}`;
}

function goals(){
  return `<div class="goals" role="group" aria-label="Сценарии">${SCEN_LIST.map(p => {
    const on = p.id === S.planId ? " on" : "";
    return `<button type="button" class="goal${on}" data-act="plan" data-id="${esc(p.id)}"><i>${p.n}</i><b>${esc(p.name)}</b><span>${esc(p.per)}</span></button>`;
  }).join("")}</div>`;
}

function cellFace(c, state){
  const color = COLOR[c.type] || "#5b8cff";
  if (state === "sil"){
    return `<button type="button" class="cell sil" style="--c:${color}" data-act="sil" aria-label="${esc(c.type)}">${ico(c.type)}</button>`;
  }
  const cls = state === "now" ? " now" : state === "done" ? " done" : "";
  const icon = state === "done" ? ico("check") : ico(c.type);
  const label = state === "done" ? c.title + ", сделано" : c.title;
  return `<button type="button" class="cell${cls}" style="--c:${color}" data-act="cell" data-id="${esc(c.id)}" aria-label="${esc(label)}">${icon}</button>`;
}

function bubbleHtml(){
  const key = offerKey();
  if (!key) return "";
  const o = S.offer[key];
  if (o.state === "on"){
    const title = key === "olymp" ? "Готовимся по " + (CASE[o.subject] || o.subject) : "Смотрим целевой набор";
    return `<div class="bubble"><b>${esc(title)}</b><button type="button" class="off" data-act="offer-off" data-id="${key}">Убрать</button></div>`;
  }
  const label = key === "olymp" ? "Олимпиада?" : "Целевое?";
  return `<button type="button" class="bubble" data-act="talk" data-id="${key}"><b>${esc(label)}</b></button>`;
}

function renderRoad(){
  INDEX = {};
  const sc = plan();
  const built = weeksOf(sc);
  const months = ["Месяц 1","Месяц 2","Месяц 3"];
  let rows = "";
  built.weeks.forEach((row, w) => {
    if (w % 4 === 0) rows += `<div class="month">${months[w / 4]}</div>`;
    const flip = w % 2 === 1 ? " flip" : "";
    const bubble = w === OFFER_WEEK ? bubbleHtml() : "";
    rows += `<div class="week"><span class="wn">${w + 1}</span><div class="lane n${row.length}${flip}">${row.map(c => cellFace(c, weekState(w))).join("")}</div>${bubble}</div>`;
  });
  const mile = built.mile;
  const mileHtml = `<div class="week mile"><button type="button" class="cell mile" data-act="cell" data-id="${esc(mile.id)}"><span class="kicker">через 3 месяца</span><b>${esc(mile.title)}</b><span class="sub">${esc(mile.note)}</span></button></div>`;
  const fog = [0,1].map(r => {
    const flip = r === 1 ? " flip" : "";
    const buttons = [0,1].map(() => `<button type="button" class="cell fog" data-act="fog" aria-label="Дальше в тумане"></button>`).join("");
    return `<div class="week"><span class="wn"></span><div class="lane n2${flip}">${buttons}</div></div>`;
  }).join("");
  const mins = S.answers.mins ? `<p class="hint">В день: ${esc(S.answers.mins)}.</p>` : "";
  const flash = S.flash ? `<p class="flash">${esc(typo(S.flash))}</p>` : "";
  return `<div class="top"><h1>Роадмап</h1><button type="button" data-act="tab" data-id="chat">Чат</button></div>
    <p class="hint">${esc(sc.lead)}</p>${mins}${flash}${goals()}
    <div class="board" id="board"><svg class="road" id="road" aria-hidden="true"></svg>${rows}${mileHtml}<p class="fogcap">Дальше соберём, когда дойдёшь.</p>${fog}</div>`;
}

function renderPort(){
  const cards = CARDS.map(c => `<article class="card"><b>${esc(c.title)}</b><span>${esc(c.meta)}. ${esc(c.note)}</span></article>`).join("");
  return `<div class="top"><h1>Портфель</h1></div><p class="hint">Сюда попадает справка, балл, документ. Галочка их не создаёт.</p><div class="cards">${cards}</div>`;
}
function renderDock(){
  const row = CARDS.map(c => `<button type="button" class="mini" data-act="tab" data-id="port"><b>${esc(c.title)}</b><span>${esc(c.meta)}</span></button>`).join("");
  return `<span class="lab">Портфель</span><div class="row">${row}</div>`;
}

function renderTaskSheet(c){
  const act = ACT[c.type];
  const state = c.week === undefined ? "" : weekState(c.week);
  let foot = "";
  if (c.kind === "mile") foot = "";
  else if (state === "done") foot = `<p class="done">Сделано</p>`;
  else if (act) foot = `<button type="button" class="btn" data-act="do" data-msg="${esc(act.done)}">${esc(act.label)}</button>`;
  return `<div class="sheet" role="dialog" aria-label="${esc(c.title)}">
    <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
    <h2>${esc(c.title)}</h2>
    ${c.text ? `<p>${esc(c.text)}</p>` : ""}
    ${foot}
  </div>`;
}

function renderTalk(){
  const key = S.talk;
  const o = S.offer[key];
  if (!o) return "";
  if (key === "olymp" && S.talkStep === "pick"){
    const chips = SUBJECTS.map(s => `<button type="button" class="chip" data-act="subject" data-id="olymp" data-val="${esc(s)}">${esc(s)}</button>`).join("");
    return `<div class="sheet" role="dialog" aria-label="Предмет олимпиады">
      <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
      <h2>Какой предмет?</h2>
      <p>${esc(typo("Выбери сам. По нему встанут четыре недели на поле."))}</p>
      <div class="chips">${chips}</div>
    </div>`;
  }
  if (key === "olymp"){
    return `<div class="sheet" role="dialog" aria-label="Олимпиада">
      <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
      <h2>Олимпиада</h2>
      <p>${esc(typo("Есть олимпиады. Диплом даёт баллы или снимает конкурс целиком. Так зачисляют 3,6%."))}</p>
      <p>${esc(typo("Выбрать предмет и начать готовиться?"))}</p>
      <div class="btns">
        <button type="button" class="btn" data-act="talk-yes" data-id="olymp">Давай</button>
        <button type="button" class="btn ghost" data-act="talk-no" data-id="olymp">Не сейчас</button>
      </div>
    </div>`;
  }
  return `<div class="sheet" role="dialog" aria-label="Целевое">
    <button type="button" class="x" data-act="close" aria-label="Закрыть">×</button>
      <h2>Целевое</h2>
      <p>${esc(typo("Есть целевой набор. Договор и бумаги ведём мы. Куда идти — выбираешь ты. Так зачисляют 6,4%."))}</p>
      <p>${esc(typo("Посмотреть, где он есть?"))}</p>
    <div class="btns">
      <button type="button" class="btn" data-act="talk-yes" data-id="target">Давай</button>
      <button type="button" class="btn ghost" data-act="talk-no" data-id="target">Не сейчас</button>
    </div>
  </div>`;
}

function renderSheet(){
  if (S.talk) return renderTalk();
  const c = INDEX[S.sheet];
  if (!c) return "";
  return renderTaskSheet(c);
}

function renderTabs(){
  const items = [["road","Роадмап"],["port","Портфель"]];
  document.getElementById("tabs").innerHTML = items.map(([id, label]) =>
    `<button type="button" data-act="tab" data-id="${id}" class="${S.screen === id ? "on" : ""}">${label}</button>`).join("");
}

function drawRoad(){
  const board = document.getElementById("board");
  const svg = document.getElementById("road");
  if (!board || !svg) return;
  const nodes = [...board.querySelectorAll(".cell")];
  if (nodes.length < 2) return;
  const br = board.getBoundingClientRect();
  const w = board.clientWidth, h = board.clientHeight;
  const pts = nodes.map(n => {
    const r = n.getBoundingClientRect();
    return {x: r.left + r.width / 2 - br.left, y: r.top + r.height / 2 - br.top};
  });
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length; i++){
    const a = pts[i - 1], b = pts[i];
    const dy = (b.y - a.y) * 0.55;
    d += ` C ${a.x} ${a.y + dy}, ${b.x} ${b.y - dy}, ${b.x} ${b.y}`;
  }
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="#3a4258" stroke-width="18" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#8b93a7" stroke-width="2" stroke-dasharray="7 9" stroke-linecap="round"/>`;
}

function render(){
  const phone = document.getElementById("phone");
  phone.classList.toggle("chat", S.screen === "chat");
  phone.classList.toggle("port", S.screen === "port");
  const app = document.getElementById("app");
  if (S.screen === "chat") app.innerHTML = renderChat();
  else if (S.screen === "port") app.innerHTML = renderPort();
  else app.innerHTML = renderRoad();
  document.getElementById("dock").innerHTML = renderDock();
  renderTabs();
  renderBanner();
  const old = phone.querySelector(".sheet");
  if (old) old.remove();
  if ((S.sheet || S.talk) && S.screen === "road") phone.insertAdjacentHTML("beforeend", renderSheet());
  if (S.screen === "road") requestAnimationFrame(() => requestAnimationFrame(drawRoad));
}

function startPlan(){
  if (S.answers.known === "Направление есть, предметы нет") return "subjects";
  if (S.answers.known === "Предметы есть, нужен вуз") return "vuz";
  return "none";
}

document.body.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "plan"){
    S.planId = el.dataset.id;
    S.sheet = null;
    S.talk = null;
    S.flash = "";
  } else if (act === "chip"){
    S.answers[el.dataset.key] = el.dataset.val;
    S.turn = Math.min(S.turn + 1, SCRIPT.length - 1);
  } else if (act === "build"){
    S.built = true;
    S.planId = startPlan();
    S.screen = "road";
    S.flash = "";
  } else if (act === "tab"){
    S.screen = el.dataset.id;
    S.sheet = null;
    S.talk = null;
  } else if (act === "cell"){
    S.sheet = el.dataset.id;
    S.talk = null;
    S.flash = "";
  } else if (act === "sil"){
    S.sheet = null;
    S.talk = null;
    S.flash = "Задание откроется на этой неделе.";
  } else if (act === "fog"){
    S.sheet = null;
    S.talk = null;
    S.flash = "Дальше соберём, когда дойдёшь.";
  } else if (act === "close"){
    S.sheet = null;
    S.talk = null;
  } else if (act === "do"){
    S.sheet = null;
    S.flash = el.dataset.msg;
  } else if (act === "talk"){
    S.talk = el.dataset.id;
    S.talkStep = "pitch";
    S.sheet = null;
    S.flash = "";
    if (S.offer[S.talk].state === "out") S.offer[S.talk].state = "ask";
  } else if (act === "talk-yes"){
    if (el.dataset.id === "olymp") S.talkStep = "pick";
    else {
      S.offer.target.state = "on";
      S.talk = null;
      S.flash = "Добавил на поле. Четыре недели.";
    }
  } else if (act === "talk-no"){
    S.offer[el.dataset.id].state = "out";
    S.talk = null;
    S.flash = "Убрал. Вернуть можно.";
  } else if (act === "subject"){
    S.offer.olymp.state = "on";
    S.offer.olymp.subject = el.dataset.val;
    S.talk = null;
    S.flash = "Добавил подготовку по " + (CASE[el.dataset.val] || el.dataset.val) + ". Четыре недели на поле.";
  } else if (act === "offer-off"){
    const o = S.offer[el.dataset.id];
    o.state = "ask";
    o.subject = "";
    S.talk = null;
    S.flash = "Убрал с поля.";
  }
  render();
});

window.addEventListener("resize", () => { if (S.screen === "road") drawRoad(); });
render();
</script>
</body>
</html>
